<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges</title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Badges</h1>
        <a href="#">News <span class="badge">10</span></a><br>
        <a href="#">Comments <span class="badge">5</span></a><br>
        <a href="#">Updates <span class="badge">7</span></a><br>

        <h2>Button Badges</h2>
        <button type="button" class="btn btn-danger">Danger <span class="badge">7</span></button>

    </div>
</body>
</html>
