<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>Glyphicons</title>
</head>
<body>
    <div class="container">
        <h2>Glyphicons</h2>
        <p>Envelope Icon: <span class="glyphicon glyphicon-envelope"></span></p>

        <p>Envelope icon as a link: <a href="#"> <span class="glyphicon glyphicon-envelope"></span></a></p>

        <!-- Search Icon -->
        <p> Search Icon: <span class="glyphicon glyphicon-search"></span></p>

        <p>Search icon as a button:
            <button type="button" class="btn btn-default">
                <span class="glyphicon glyphicon-search"> Search</span>
            </button>
        </p>
        <p>Search icon on a styled button:
            <button type="button" class="btn btn-info">
                <span class="glyphicon glyphicon-search"> Search</span>
            </button>
        </p>

        <!-- Print Icon -->
        <p> Print Icon: <span class="glyphicon glyphicon-print"></span></p>

        <p> Print icon on a styled link button:
            <a href="#" class="btn btn-success btn-lg">
                <span class="glyphicon glyphicon-search"></span> Search
            </a>
        </p>

        <!-- Heart Icon -->
         <p>Heart Icon: <span class="glyphicon glyphicon-heart"></span></p>

         <p>Heart Icon on a styled button
            <button type="button" class="btn btn-danger">
                <span class="glyphicon glyphicon-heart"></span>
                Like
            </button>
         </p>

         <!-- Fire Icon -->
          <p>Fire Icon: <span class="glyphicon glyphicon-fire"></span></p>

         <p>Fire Icon on a styled button
            <button type="button" class="btn btn-warning">
                <span class="glyphicon glyphicon-fire"></span>
                Reaction
            </button>
         </p>
    </div>
</body>
</html>
