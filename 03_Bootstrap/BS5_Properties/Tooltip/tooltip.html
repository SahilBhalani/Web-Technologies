<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tooltip</title>
</head>
<body>
    <div class="container">
        <h2>Tooltip</h2>
        <button type="button" class="btn btn-primary" data-bs-placement="top" data-bs-toggle="tooltip" title="Hooray!">Hover over me!</button>
        <button type="button" class="btn btn-primary" data-bs-placement="bottom" data-bs-toggle="tooltip" title="Hooray!">Hover over me!</button>
        <button type="button" class="btn btn-primary" data-bs-placement="left" data-bs-toggle="tooltip" title="Hooray!">Hover over me!</button>
        <button type="button" class="btn btn-primary" data-bs-placement="right" data-bs-toggle="tooltip" title="Hooray!">Hover over me!</button>
       
    </div>
</body>
<script>
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
  return new bootstrap.Tooltip(tooltipTriggerEl)
})
</script>
</html>
