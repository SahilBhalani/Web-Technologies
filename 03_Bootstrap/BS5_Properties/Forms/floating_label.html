<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Floating Labels</title>
</head>
<body>
    <div class="container">
        <h2>Floating Labels / Animated Labels</h2>
        <div class="form-floating mb-3 mt-3">
            <input type="text" class="form-control" id="email" placeholder="Enter Email" name="email">
            <label for="email">Email</label>
        </div>
        <div class="form-floating mb-3 mt-3">
            <input type="text" class="form-control" id="pwd" placeholder="Enter Password" name="pswd">
            <label for="password">Password</label>
        </div>

        <div class="form-floating mb-3 mt-3">
            <textarea name="text" id="comment" class="form-control" placeholder="Comment goes here"></textarea>
            <label for="comment">Comments</label>
        </div>
        <div class="form-floating">
            <select name="sellist" id="sel1" class="form-select">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>
            <label for="sel1" class="from-label">Select list (select one):</label>
        </div>
    </div>
    
</body>
</html>
