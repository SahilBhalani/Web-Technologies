<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Stacked Form</h2>
        <form action="#">
            <div class="mb-3 mt-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label for="pwd" class="form-label">Password:</label>
                <input type="password" name="pswd" class="form-control" id="pwd" placeholder="Enter Password">
            </div>

            <div class="form-check mb-3">
                <label class="form-check-label">
                    <input type="checkbox" name="remember" class="form-check-input">Remember Me!
                </label>
            </div>
            
            <div class="mb-3">
                <label for="commnet">Comments:</label>
                <textarea name="text" id="comment" rows="1"></textarea>
            </div>

            <button type="button" class="btn btn-primary">Submit</button>
        </form><hr>

        <h2>Form Row/Grid (Inline Forms)</h2>
        <form>
            <div class="row">
                <div class="col">
                    <input type="email" class="form-control" placeholder="Enter Email">
                </div>
                <div class="col">
                    <input type="password" name="pswd" class="form-control" placeholder="Enter Password">
                </div>
            </div>
        </form><hr>

        <h2>Form Control Size</h2>
        <form>
            <input type="text" class="form-control form-control-lg mb-2" placeholder="Large Input">
            <input type="text" class="form-control mb-2" placeholder="Normal Input">
            <input type="text" class="form-control form-control-sm" placeholder="Small Input">
        </form><hr>

        <h2>Disable and Readonly</h2>
        <form>
            <input type="text" class="form-control mb-2" placeholder="Normal Input">
            <input type="text" class="form-control mb-2" placeholder="Disabled Input" disabled>
            <input type="text" class="form-control" placeholder="Readonly Input" readonly>
        </form><hr>

        <h2>Plain Text Inputs</h2>
        <form>
            <input type="text" class="form-control-plaintext mb-2" placeholder="Plaintext Input">
            <input type="text" class="form-control" placeholder="Normal Input">
        </form><hr>

        <h2>Color Picker</h2>
        <form >
        <input type="color" class="form-control form-control-color" value="#ff0000">
        </form><hr>


        <h2>Datalist</h2>
        <form action="#">
            <label for="car" class="form-label">Choose Your Car From The List:</label>
            <input class="form-control" list="cars" name="car" id="car">
            <datalist id="cars">
                <option value="BMW">
                <option value="Audi">
                <option value="Mercedes">
                <option value="Porsche">
                <option value="Nissan">
            </datalist>
        </form><hr>
    </div>
</body>
</html>
