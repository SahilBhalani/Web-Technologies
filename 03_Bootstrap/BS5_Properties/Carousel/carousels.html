<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
    <h2>Carousels</h2>
    <div id="demo" class="carousel slide" data-bs-ride="carousel">

        <!-- Carousel Indicators -->
         <div class="carousel-indicators">
         <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
         <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
         <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
         </div>

         <!-- The Sildeshow/ Carousel -->
          <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://www.w3schools.com/bootstrap5/ny.jpg" alt="ny" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>New York</h3>
                    <p>Oiiiiiiiiiiiiii! NY!</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://www.w3schools.com/bootstrap5/chicago.jpg" alt="chi" class="d-block w-100">
                 <div class="carousel-caption">
                    <h3>Chicago</h3>
                    <p>Oiiiiiiiiiiiiii! NY!</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://www.w3schools.com/bootstrap5/la.jpg" alt="la" class="d-block w-100">
                 <div class="carousel-caption">
                    <h3>Los Angeles</h3>
                    <p>Oiiiiiiiiiiiiii! NY!</p>
                </div>
            </div>
          </div>

          <!-- Left- Right Controls -->
           <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
           </button>
           <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
           </button>


    </div>
    </div>
</body>
</html>
