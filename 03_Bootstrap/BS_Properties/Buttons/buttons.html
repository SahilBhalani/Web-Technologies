<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styles</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">

        <h1>Button Styles</h1>

        <!-- Types Of Buttons  -->
        <button type="button" class="btn">Basic</button>
        <button type="button" class="btn btn-default">Default</button>
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-success">Success</button>
        <button type="button" class="btn btn-info">Info</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-danger">Danger</button>
        <button type="button" class="btn btn-link">Link</button>

        <!-- Using Buttons in diffrent types of element -->
        <h2>Using Buttons in diffrent types of element</h2>
         <a href="#" class="btn btn-info" role="button">Link Button</a>
         <input type="button" class="btn btn-success" value="Input Button">
         <input type="submit" class="btn btn-danger" value="Submit Button">

         <!-- Button Sizes -->
         <h2>Button Sizes</h2>
         <button type="button" class="btn btn-primary btn-lg">Large Button</button>
         <button type="button" class="btn btn-primary">Normal Button</button>
         <button type="button" class="btn btn-primary btn-sm">Small Button</button>
         <button type="button" class="btn btn-primary btn-xs">Extra Small Button</button>

         <!-- Block Level Buttons -->
          <h2>Block Level Button</h2>
          <button type="button" class="btn btn-info btn-block">Button 1</button>
          <button type="button" class="btn btn-default btn-block">Button 2</button>

          <!-- Active / Disabled Button -->
           <h2>Active / Disabled Button</h2>
           <button type="button" class="btn btn-primary active">Active Primary</button>
           <button type="button" class="btn btn-primary disabled">Disabled Primary</button>
    </div>
</body>
</html>
