<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>Button Group</title>
</head>
<body>
    <div class="container">
        <!-- Button Groups -->
        <h2>Button Groups</h2>
        <div class="btn-group">
            <button type="button" class="btn btn-primary">Apple</button>
            <button type="button" class="btn btn-primary">Samsung</button>
            <button type="button" class="btn btn-primary">Sony</button>
        </div>

        <!-- Button Group Sizes -->
         <h2> Diffrent Sizes of Button Groups</h2>
        <div class="btn-group btn-group-lg">
            <button type="button" class="btn btn-primary">Apple</button>
            <button type="button" class="btn btn-primary">Samsung</button>
            <button type="button" class="btn btn-primary">Sony</button>
        </div>

        <!-- Vertical Button Group -->
        <h2> Vertical Button Group</h2>
        <div class="btn-group-vertical">
            <button type="button" class="btn btn-primary">Apple</button>
            <button type="button" class="btn btn-primary">Samsung</button>
            <button type="button" class="btn btn-primary">Sony</button>
        </div>

        <!-- Justified Button Group With Anchor Tag-->
         <h2>Justified Button Group</h2>
         <div class="btn-group btn-group-justified">
            <a href="#" class="btn btn-primary">Apple</a>
            <a href="#" class="btn btn-primary">Samsung</a>
            <a href="#" class="btn btn-primary">Sony</a>
         </div>

         <!--Justified Button Group With Button -->
         <h2>Justified Button Group With Button</h2>
         <div class="btn-group btn-group-justified">
            <div class="btn-group">
                <button type="button" class="btn btn-danger">Apple</button>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-danger">Samsung</button>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-danger">Sony</button>
            </div>
         </div>

         <!-- Nesting Button Groups & Droopdown Menus -->
          <h2>Nesting Button Groups & Dropdown Menus</h2>
          <div class="btn-group">
            <button type="button" class="btn btn-warning">Apple</button>
            <button type="button" class="btn btn-warning">Samsung</button>
                <div class="btn-group">
                    <button type="button" class="btn btn-warning dropdown-toggle" data-toggle="dropdown">Sony
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" role="menu">
                        <li><a href="#">Tablet</a></li>
                        <li><a href="#">Smartphone</a></li>
                    </ul>
                </div>
          </div>

          <!-- Split Button Dropdown -->
           <h2>Split Button Dropdown</h2>
          <div class="btn-group">
                    <button type="button" class="btn btn-primary">Sony</button>
                    <button type="button" class="btn btn-danger dropdown-toggle" data-toggle="dropdown">
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" role="menu">
                        <li><a href="#">Tablet</a></li>
                        <li><a href="#">Smartphone</a></li>
                    </ul>
                </div>


    </div>
</body>
</html>
