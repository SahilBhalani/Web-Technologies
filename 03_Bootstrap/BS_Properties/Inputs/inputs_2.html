<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs 2</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Input Groups</h2>
        <form action="#">
            <div class="input-group">
                <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                <input type="email" name="email" id="email" class="form-control" placeholder="email">
            </div>

            <div class="input-group">
                <span class="input-group-addon"><i class="glyphicon glyphicon-lock"></i></span>
                <input type="password" class="form-control" name="password" id="password" placeholder="password">
            </div>

            <div class="input-group">
                <span class="input-group-addon">Text</span>
                <input type="text" name="text" class="form-control" id="text" placeholder="Additional Info">
            </div>

            <div class="input-group">
                <input type="text" class="form-control" placeholder="search">
                <div class="input-group-btn">
                    <button type="submit" class="btn btn-default">
                        <i class="glyphicon glyphicon-search"></i>
                    </button>
                </div>
            </div>
        </form>

        <h2>Horizontal Form: Control States</h2>
        <form action="#" class="form-horizontal">
            <div class="form-group">
                <label class="col-sm-2 control-label" for="focusedInput">Focused</label>
                <div class="col-sm-10">
                    <input type="text" id="focusedInput" class="form-control" value="Click to focus...">
                </div>
            </div>
            <div class="form-group">
                <label for="disabledInput" class="col-sm-2 control-label">Disabled</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="disabledInput" placeholder="Disabled input here..." disabled>
                </div>
            </div>

            <fieldset disabled>
            <div class="form-group">
                <label for="disabledTexInput" class="col-sm-2 control-label">Disabled input and select list(Fieldset disabled)</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="disabledTexInput" placeholder="Disabled input">
                </div>
            </div>
            <div class="form-group">
                <label for="disabledSelect" class="col-sm-2"></label>
                <div class="col-sm-10">
                    <select class="form-control" id="disabledSelect">
                        <option>Disabled Select</option>
                    </select> 
                </div>
            </div>
            </fieldset>

            <div class="form-group has-success has-feedback">
                <label for="inputSuccess" class="col-sm-2 control-label">Input Success With Glyphicon</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputSuccess">
                        <span class="glyphicon glyphicon-ok form-control-feedback"></span>
                    </div>
            </div>
            <div class="form-group has-warning has-feedback">
                <label for="inputWarning" class="col-sm-2 control-label">Input Warning With Glyphicon</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputWarning">
                        <span class="glyphicon glyphicon-warning-sign form-control-feedback"></span>
                    </div>
            </div>
            <div class="form-group has-error has-feedback">
                <label for="inputError" class="col-sm-2 control-label">Input Error With Glyphicon</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="inputError">
                        <span class="glyphicon glyphicon-remove form-control-feedback"></span>
                    </div>
            </div>
        </form>
    </div>
</body>
</html>
