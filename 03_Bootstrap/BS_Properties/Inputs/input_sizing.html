<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>Input Sizing</title>
</head>
<body>
    <div class="container">
        <h2>Input Sizing</h2>
        <form action="">
            <div class="form-group">
                <label for="inputsm">Small Input</label>
                <input type="text"  class="form-control input-sm" id="inputsm">
            </div>
            <div class="form-group">
                <label for="inputdefault">Defualt Input</label>
                <input type="text"  class="form-control" id="inputdefault">
            </div>
            <div class="form-group">
                <label for="inputlg">Large Input</label>
                <input type="text"  class="form-control input-lg" id="inputlg">
            </div>
        </form>

        <h2>Horizontal Input Sizing</h2>
        <form class="form-horizontal">
            <div class="form-group form-group-lg">
                <label for="lg" class="col-sm-2 control-label">form-group-lg</label>
                <div class="col-sm-10">
                    <input type="text" id="ig" class="form-control">
                </div>
            </div>
            <div class="form-group form-group-sm">
                <label for="sm" class="col-sm-2 control-label">form-group-sm</label>
                <div class="col-sm-10">
                    <input type="text" id="sm" class="form-control">
                </div>
            </div>
        </form>

        <h2>Column Sizing</h2>
        <form>
            <div class="form-group row">
                <div class="col-xs-2">
                    <label for="ex1">col-xs-2</label>
                    <input type="text" id="ex1" class="form-control">
                </div>
                <div class="col-xs-3">
                    <label for="ex2">col-xs-3</label>
                    <input type="text" id="ex2" class="form-control">
                </div>
                <div class="col-xs-4">
                    <label for="ex3">col-xs-4</label>
                    <input type="text" id="ex3" class="form-control">
                </div>
            </div>
        </form>

        <h2>Help Text</h2>
        <form>
            <div class="form-group">
                <label for="pwd">Password:</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter Password">
                <span class="help-block">This is some help text...</span>
            </div>
        </form>
    </div>
</body>
</html>
