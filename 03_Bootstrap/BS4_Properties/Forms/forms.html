<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Bootstrap 4 Stacked Form</h2>
        <form action="#">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter Email">
            </div>
            <div class="form-group">
                <label for="pwd">Password:</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter Password:">
            </div>

            <div class="form-group form-check">
                <label for="form-check-label">
                    <input type="checkbox" class="form-check-input">Remember Me!
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form><hr>

        <h2>Inline Form</h2>
        <form action="#" class="form-inline">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter Email">
            </div>
            <div class="form-group">
                <label for="pwd">Password:</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter Password:">
            </div>

            <div class="form-group form-check">
                <label for="form-check-label">
                    <input type="checkbox" class="form-check-input">Remember Me!
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form><hr>

        <h2>Inline Form With Utilities</h2>
         <form action="#" class="form-inline">
            <div class="form-group">
                <label for="email" class="mr-sm-2">Email Address:</label>
                <input type="email" class="form-control mb-2 mr-sm-2" id="email" placeholder="Enter Email">
            </div>
            <div class="form-group">
                <label for="pwd" class="mr-sm-2">Password:</label>
                <input type="password" class="form-control mb-2 mb-sm-2" id="pwd" placeholder="Enter Password:">
            </div>

            <div class="form-group form-check">
                <label for="form-check-label">
                    <input type="checkbox" class="form-check-input">Remember Me!
                </label>
            </div>
            <button type="submit" class="btn btn-primary mb-2">Submit</button>
        </form><hr>

        <h2>Form Row/Grid</h2>
        <form>
            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" name="email" id="email" placeholder="Enter Email">
                </div>
                <div class="col">
                    <input type="password" class="form-control" name="pswd" id="pswd" placeholder="Enter Password">
                </div>
            </div>
        </form><hr>

        <h2>Form Row/Grid With Less Margin</h2>
        <form>
            <div class="form-row">
                <div class="col">
                    <input type="text" class="form-control" name="email" id="email" placeholder="Enter Email">
                </div>
                <div class="col">
                    <input type="password" class="form-control" name="pswd" id="pswd" placeholder="Enter Password">
                </div>
            </div>
        </form><hr>

        <h2>Form Validation</h2>
        <form action="#" class="was-validated">
            <div class="form-group">
                <label for="uname">Username:</label>
                <input type="text" name="uname" id="uname" placeholder="Enter Username" class="form-control" required>
                <div class="valid-feedback">Valid!</div>
                <div class="invalid-feedback">Please fill out this field</div>
            </div>
            <div class="form-group">
                <label for="pwd">Password:</label>
                <input type="password" name="pwd" id="pwd" placeholder="Enter Password" class="form-control" required>
                <div class="valid-feedback">Valid!</div>
                <div class="invalid-feedback">Please fill out this field</div>
            </div>
            <div class="form-group form-check">
                <label for="form-check-label">
                    <input type="checkbox" name="remember" class="form-check-input" required>I agree on blabla.
                    <div class="valid-feedback">Valid!</div>
                   <div class="invalid-feedback">Check ths checkbox to continue</div>
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>

        </form>




    </div>
</body>
</html>
