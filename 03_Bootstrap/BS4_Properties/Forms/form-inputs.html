<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Inputs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="conatainer">
        <h2>Form Inputs</h2>
        <div class="form-group">
            <label for="uname">Username:</label>
            <input type="text" id="uname" class="form-control">
        </div>

        <div class="form-group">
            <label for="pwd">Password:</label>
            <input type="password" id="pwd" class="form-control">
        </div>

        <div class="form-group">
            <label for="cmnt">Comments:</label>
            <textarea class="form-control" id="cmnt" rows="5"></textarea>
        </div>

        <div class="form-check">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 1
            </label>
        </div>
        <div class="form-check">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 2
            </label>
        </div>
        <div class="form-check">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 3
            </label>
        </div>

        <!-- Inline Check -->
        <div class="form-check-inline">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 1
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 2
            </label>
        </div>
        <div class="form-check-inline">
            <label for="form-check-label">
                <input type="checkbox" class="form-check-input" value="">Option 3
            </label>
        </div>

        <!-- Radio Buttons -->
           <div class="form-check">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Option 1
            </label>
        </div>
           <div class="form-check">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio">Option 2
            </label>
        </div>
           <div class="form-check">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio" disabled>Option 3
            </label>
        </div>

        <!-- Radio Buttons inline -->
          <div class="form-check-inline">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio1">Option 1
            </label>
            </div>
          <div class="form-check-inline">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio1">Option 2
            </label>
            </div>
          <div class="form-check-inline">
            <label for="form-check-label">
                <input type="radio" class="form-check-input" name="optradio1" disabled>Option 3
            </label>
            </div>

            <div class="form-group">
                <label for="sel1">Select List:</label>
                <select class="form-control" id="sel1">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                </select>
            </div>
            <div class="form-group">
                <label for="sel1">Multiple Select List:</label>
                <select multiple class="form-control" id="sel1">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                </select>
            </div>

            <div class="form-group">
                <input type="range" class="form-control-range" name="range">
            </div>
         


    </div>
</body>
</html>
