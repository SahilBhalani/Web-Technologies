<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Basic Collapsible</h2>
        <button type="button" class="btn btn-primary" data-toggle="collapse" data-target="#demo">Collapsible</button>

        <a href="#demo" data-toggle="collapse">Collapsible</a>

        <div id="demo" class="collapse">
            Lorem ipsum dolor sit amet.
        </div><hr>

        <h2>Accordion</h2>
        <div id="accordion">

            <div class="card">
                <div class="card-header">
                    <a href="#collapseOne" data-toggle="collapse" class="card-link">Collapsible Group Item 1</a>
                </div>
                <div id="collapseOne" class="collapse show" data-parent="#accordion">
                    <div class="card-body">
                        Lorem, ipsum.
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <a href="#collapseTwo" data-toggle="collapse" class="collapsed card-link">Collapsible Group Item 2</a>
                </div>
                <div id="collapseTwo" class="collapse" data-parent="#accordion">
                    <div class="card-body">
                        Lorem, ipsum.
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <a href="#collapseThree" data-toggle="collapse" class=" collapsed card-link">Collapsible Group Item 3</a>
                </div>
                <div id="collapseThree" class="collapse" data-parent="#accordion">
                    <div class="card-body">
                        Lorem, ipsum.
                    </div>
                </div>
            </div>


        </div>
    </div>
</body>
</html>
