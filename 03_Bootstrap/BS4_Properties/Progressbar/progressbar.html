<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Progress Bar</title>
</head>
<body>
    <!-- Progress Bar Examples -->
    <div class="container">
        <h2>Basic Progress Bar</h2>
        <div class="progress">
            <div class="progress-bar" style="width: 70%;"></div>
        </div><hr>

        <h2>Progress Bar Height</h2>
        <div class="progress" style="height: 10px;">
            <div class="progress-bar" style="width: 40%; height: 10px;"></div>
        </div><br>
        <div class="progress" style="height: 20px;">
            <div class="progress-bar" style="width: 50%; height: 20px;"></div>
        </div><br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar" style="width: 60%; height: 30px;"></div>
        </div><br><hr>

        <h2>Progress Bar Labels</h2>
        <div class="progress">
            <div class="progress-bar" style="width: 65%;">65%</div>
        </div><hr>

        <h2>Colored Progress Bar</h2>
        <div class="progress">
            <div class="progress-bar bg-primary" style="width: 10%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-success" style="width: 20%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-info" style="width: 30%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-warning" style="width: 40%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-danger" style="width: 50%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-white" style="width: 60%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-secondary" style="width: 70%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-light" style="width: 80%;"></div>
        </div><br>
        <div class="progress">
            <div class="progress-bar bg-dark" style="width: 90%;"></div>
        </div>


    </div>
</body>
</html>
