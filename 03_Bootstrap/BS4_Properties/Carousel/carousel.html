<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousels</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .carousel-inner img{
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bootstrap 4 Carousel</h2>
        <div id="demo" class="carousel slide" data-ride="carousel">

            <!-- Indicators -->
             <ul class="carousel-indicators">
                <li data-target="#demo" data-slide-to="0" class="active"></li>
                <li data-target="#demo" data-slide-to="1"></li>
                <li data-target="#demo" data-slide-to="2"></li>
             </ul>


             <!-- Slideshow -->
              <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://www.w3schools.com/bootstrap4/la.jpg" alt="">
                    <div class="carousel-caption">
                        <h3>Los Angeles</h3>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic, maxime!</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://www.w3schools.com/bootstrap4/chicago.jpg" alt="">
                    <div class="carousel-caption">
                        <h3>Chicago</h3>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic, maxime!</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://www.w3schools.com/bootstrap4/ny.jpg" alt="">
                    <div class="carousel-caption">
                        <h3>New York</h3>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic, maxime!</p>
                    </div>
                </div>
              </div>

              <!-- Controls -->
               <a href="#demo" class="carousel-control-prev" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
               </a>
               <a href="#demo" class="carousel-control-next" data-slide="next">
                <span class="carousel-control-next-icon"></span>
               </a>
        </div>
    </div>
</body>
</html>
