<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Height</title>
</head>
<body class="text-center">
    <h1 class="text-4xl font-bold">Height</h1>
    <div class="flex flex-wrap-reverse p-4 mx-12 space-x-4 h-64 bg-green-200">
        <div class="h-8 w-12 bg-green-400 rounded-lg">h-8</div>
        <div class="h-12 w-12 bg-green-400 rounded-lg">h-12</div>
        <div class="h-16 w-12 bg-green-400 rounded-lg">h-16</div>
        <div class="h-20 w-12 bg-green-400 rounded-lg">h-20</div>
        <div class="h-24 w-12 bg-green-400 rounded-lg">h-24</div>
        <div class="h-32 w-12 bg-green-400 rounded-lg">h-32</div>
        <div class="h-40 w-12 bg-green-400 rounded-lg">h-40</div>
        <div class="h-48 w-12 bg-green-400 rounded-lg">h-48</div>
        <div class="h-52 w-12 bg-green-400 rounded-lg">h-52</div>
    </div><br>

      <div class="mx-48 bg-green-200 p-8">
        <div class="h-auto bg-green-400 
                    rounded-lg">h-auto</div>
    </div><br>

    <div class="mx-48 bg-green-200 p-8">
        <div class="h-screen bg-green-400 
                    rounded-lg">h-screen</div>
    </div><br>

    <div class="mx-48 h-48 bg-green-200 p-8">
        <div class="h-full bg-green-400 
                    rounded-lg">h-full</div>
    </div><br>

    <h1 class="text-center font-bold">Min Height</h1>
     <div class="mx-48 bg-green-200 p-8">
        <div class="min-h-screen bg-green-400 
                    rounded-lg">min-h-screen</div>
    </div><br> 

     <div class="mx-48 bg-green-200 p-8">
        <div class="min-h-full bg-green-400 
                    rounded-lg">min-h-full</div>
    </div><br>

     <div class="mx-48 bg-green-200 p-8">
        <div class="min-h-0 bg-green-400 
                    rounded-lg">min-h-0</div>
    </div>
</body>
</html>
