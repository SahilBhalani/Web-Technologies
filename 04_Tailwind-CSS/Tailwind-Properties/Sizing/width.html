<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Width</title>
</head>
<body>
    
    <!-- 
    w-0: This class means the width is set to zero.
    w-auto: This class means the width is set according to the content
    w-1/2: This class means the width is set to half of the window.
    w-1/3: This class means the width is set to one-third of the window.
    w-1/4: This class means the width is set to one-fourth of the window.
    w-1/5: This class means the width is set to one-fifth of the window.
    w-1/6: This class means the width is set to one-sixth of the window.
    w-1/12: This class means the width is set to one-twelfth of the window.
    w-full: This class means the width is set to full.
    w-screen: This class means the width is set to the screen size.
    w-min:  This class is used to define the min-width.
    w-max: This class is used to define the max-width.
    -->

    <h1 class="text-4xl font-bold">Tailwind CSS Width Class</h1>
    <div class="flex">
        <div class="w-1/2 bg-green-500 h-12 rounded-l-lg">
            w-1/2
        </div>

        <div class="w-1/2 bg-green-600 h-12 rounded-r-lg">
            w-1/2
        </div>
    </div><br>
    <div class="flex">
        <div class="w-2/5 bg-green-500 h-12 rounded-l-lg">
            w-2/5
        </div>

        <div class="w-3/5 bg-green-600 h-12 rounded-r-lg">
            w-3/5
        </div>
    </div><br>
    <div class="flex">
        <div class="w-1/3 bg-green-500 h-12 rounded-l-lg">
            w-1/3
        </div>

        <div class="w-2/3 bg-green-600 h-12 rounded-r-lg">
            w-2/3
        </div>
    </div><br>
    <div class="flex">
        <div class="w-1/4 bg-green-500 h-12 rounded-l-lg">
            w-1/4
        </div>

        <div class="w-3/4 bg-green-600 h-12 rounded-r-lg">
            w-3/4
        </div>
    </div><br>
    <div class="flex">
        <div class="w-1/5 bg-green-500 h-12 rounded-l-lg">
            w-1/5
        </div>

        <div class="w-4/5 bg-green-600 h-12 rounded-r-lg">
            w-4/5
        </div>
    </div><br>
    <div class="flex">
        <div class="w-1/6 bg-green-500 h-12 rounded-l-lg">
            w-1/6
        </div>

        <div class="w-5/6 bg-green-600 h-12 rounded-r-lg">
            w-5/6
        </div>
    </div><br>

    <div class="w-full bg-green-600 h-12 rounded-lg">
        w-full
    </div>

    <!-- Min-width -->
     <h1 class="text-4xl font-bold">Min-Width</h1>
     <div class="w-24 h-16 min-w-full md:min-w-0 bg-green-400 rounded-lg text-white"></div>

     <!-- Max-width -->
      <h1 class="text-4xl font-bold">Max-Width</h1>
      <div class="h-8 max-w-xs mx-auto bg-green-400 rounded-lg text-white">max-w-xs</div><br>
      <div class="h-8 max-w-xs mx-auto bg-green-400 rounded-lg text-white">max-w-md</div><br>
      <div class="h-8 max-w-lg mx-auto bg-green-400 rounded-lg text-white">max-w-lg</div><br>
      <div class="h-8 max-w-xl mx-auto bg-green-400 rounded-lg text-white">max-w-xl</div><br>
      <div class="h-8 max-w-2xl mx-auto bg-green-400 rounded-lg text-white">max-w-2xl</div><br>
      <div class="h-8 max-w-max mx-auto bg-green-400 rounded-lg text-white">max-w-max</div><br>
      
</body>
</html>
