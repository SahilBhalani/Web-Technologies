<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Positions</title>
</head>
<body class="text-center">
    <h1>Taillwind CSS Positions</h1>  



    <div class="static text-left p-2 m-2 bg-green-200 h-48">
        <p class="font-bold">Static Parent</p>
  
        <div class=" absolute bottom-0 left-0 p-2 bg-green-500">
            <p>Absolute Child</p>
        </div>

        <b>Tailwind CSS Position Class</b>
        <div class="overflow-auto bg-green-200 mx-16 h-24 text-justify">
            <div class="float-right fixed">
                <p class=" bg-green-500 p-2">
                    GeeksforGeeks Fixed Child
                </p>
            </div>
        </div>

        <br>

        <div class="static text-left p-2 m-2 bg-green-200 h-48">
            <p class="font-bold">Static Parent</p>

            <div class="relative p-2 inline-block bg-green-500">
                <p>Relative Child</p>
            </div>
            <div class="relative p-2 inline-block bg-green-600">
                <p>Relative Sibling Child</p>
            </div>


        </div>
    </div>
</body>
</html>
