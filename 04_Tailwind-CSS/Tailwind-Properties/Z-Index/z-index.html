<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Z-index</title>
</head>
<body>
    <h1 class="text-4xl font-bold">Tailwind CSS Z-Index Class</h1>
    <div class="flex-column">
        <div class="relative z-0 w-full h-12 bg-green-400" style="top: 32px;">0</div>
        <div class="relative z-10 w-full h-12 bg-yellow-400">1</div>
        <div class="relative z-20 w-full h-12 bg-blue-400">2</div>
        <div class="relative z-30 w-full h-12 bg-red-400">3</div>
        <div class="relative z-40 w-full h-12 bg-green-300">4</div>
        <div class="relative z-50 w-full h-12 bg-orange-400">5</div>
    </div>
</body>
</html>
