<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Box-Shadow</title>
</head>
<body>
    <h1 class="text-4xl font-bold">Box Shadow</h1>
    <div class="grid grid-flow-col text-center p-2">
        <div class="shadow-sm w-24 h-24 bg-red-300 rounded-lg">shadow-sm</div>
        <div class="shadow w-24 h-24 bg-red-300 rounded-lg">shadow-sm</div>
        <div class="shadow-md w-24 h-24 bg-red-300 rounded-lg">shadow-md</div>
        <div class="shadow-lg w-24 h-24 bg-red-300 rounded-lg">shadow-lg</div>
        <div class="shadow-xl w-24 h-24 bg-red-300 rounded-lg">shadow-xl</div>
        <div class="shadow-2xl w-24 h-24 bg-red-300 rounded-lg">shadow-2xl</div>
    </div>
</body>
</html>
