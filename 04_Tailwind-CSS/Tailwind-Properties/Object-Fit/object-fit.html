<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object-fit</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="text-center">
    <p><b>Tailwind CSS object clas</b></p>
    <div class="bg-green-300 w-full h-full">
        <img src="./26-367x267.jpg" class="object-contain w-10 h-full" alt="">
    </div><br>

    <div class="bg-green-300 w-full h-full">
        <img class="object-cover h-48 w-full" src="./26-367x267.jpg"  alt=""><br>

    <div class="bg-green-300 w-full h-full">
        <img class="object-fill h-48 w-full" src="./26-367x267.jpg"  alt="">
    </div><br>

    <div class="bg-green-300 w-full h-full">
        <img class="object-none h-48 w-full" src="./26-367x267.jpg"  alt="">
    </div><br>

    <div class="bg-green-300 w-full h-full">
        <img class="object-scale-down h-48 w-full" src="./26-367x267.jpg"  alt="">
    </div><br>
</body>
</html>
