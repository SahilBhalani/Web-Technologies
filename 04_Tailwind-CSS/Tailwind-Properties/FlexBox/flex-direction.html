<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Direction</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-4xl font-bold">Tailwind CSS Flex-Row Class</h1>
    <div class="flex flex-row justify-evenly">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div> <br>
    <h1 class="text-4xl font-bold">Tailwind CSS Flex-Row-Reverse Class</h1>
    <div class="flex flex-row-reverse justify-evenly">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div><br>
    <h1 class="text-4xl font-bold">Tailwind CSS Flex-Col Class</h1>
    <div class="flex flex-col justify-evenly">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div><br>

     <h1 class="text-4xl font-bold">Tailwind CSS Flex-Col-Reverse Class</h1>
    <div class="flex flex-col-reverse justify-evenly">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div><br>

    

</body>
</html>
