<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-center text-4xl font-bold">Tailwind CSS flex-1 Class</h1>
    <div class="bg-green-200 border-4 border-green-600 w-2/3 ml-32">
        <p class="ml-2">This is the effect of flex-1</p>

        <div class="flex m-2 text-white">
            <div class="bg-green-900 flex-1">
                GeeksforGeeks
            </div>
            <div class="bg-green-800 flex-1">
                TailWind CSS
            </div>
        </div>


        <p class="ml-2"> This is effect of flex-initial </p>
         <div class="flex m-2 text-white">
            <div class="bg-green-900 flex-initial">
                GeeksforGeeks
            </div>
            <div class="bg-green-800 flex-initial">
                TailWind CSS
            </div>
        </div>

        <p class="ml-2"> This is effect of flex-auto </p>
         <div class="flex m-2 text-white">
            <div class="bg-green-900 flex-auto">
                GeeksforGeeks
            </div>
            <div class="bg-green-500 flex-auto">
                TailWind CSS
            </div>
        </div>



        <p class="ml-2"> This is effect of flex-none </p>
         <div class="flex m-2 text-white">
            <div class="bg-green-900 flex-none">
                GeeksforGeeks
            </div>
            <div class="bg-green-800 flex-none">
                TailWind CSS
            </div>
        </div>
    </div>
</body>
</html>
