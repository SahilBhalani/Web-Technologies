<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Flex-Shrink</title>
</head>
<body>
    <h1 class="text-4xl font-bold">
        Flex-Shrink-0
    </h1>
    <div class="flex justify-evenly space-x-2 ml-12 mr-12">
        <div class="rounded bg-green-600 flex-1 h-12">Side Part</div>
        <div class="rounded bg-green-600 flex-shrink-0 h-12">Flex-Shrink-0</div>
        <div class="rounded bg-green-600 flex-1 h-12">Side part</div>
    </div><br>
    <h1 class="text-4xl font-bold">
        Flex-Shrink
    </h1>
    <div class="flex justify-evenly space-x-2 ml-12 mr-12">
        <div class="rounded bg-green-600 flex-grow w-16 h-12">Side Part</div>
        <div class="rounded bg-green-600 flex-shrink h-12">Flex-Shrink</div>
        <div class="rounded bg-green-600 flex-grow w-16 h-12">Side part</div>
    </div>
</body>
</html>
