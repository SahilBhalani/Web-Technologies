<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Wrap</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-4xl font-bold">Flex-Wrap</h1>
    <div class="ml-24 h-28 w-2/3 flex flex-wrap bg-green-200 border-solid border-4 border-green-900">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div>
    <h1 class="text-4xl font-bold">Flex-Nowrap</h1>
    <div class="ml-24 h-28 w-2/3 flex flex-nowrap bg-green-200 border-solid border-4 border-green-900">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div>
    <h1 class="text-4xl font-bold">Flex-Wrap-Reverse</h1>
    <div class="ml-24 h-28 w-2/3 flex flex-wrap-reverse bg-green-200 border-solid border-4 border-green-900">
        <div class="bg-green-900 w-24 h-12">1</div>
        <div class="bg-green-800 w-24 h-12">2</div>
        <div class="bg-green-700 w-24 h-12">3</div>
        <div class="bg-green-600 w-24 h-12">4</div>
        <div class="bg-green-500 w-24 h-12">5</div>
        <div class="bg-green-400 w-24 h-12">6</div>
    </div>
</body>
</html>
