<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Background Clip</title>
</head>
<body class="text-center mx-4 space-y-2">
    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500">Background Clip Class</h1>

    <div class="mx-2 grid grid-cols-3 gap-2 bg-green-200 rounded-xl">
        <div class="bg-clip-border p-6 bg-green-600 border-dashed border-4 border-green-300"></div><br>

        <div class="bg-clip-padding p-6 bg-green-600 border-dashed border-4 border-green-300"></div><br>
        
        <div class="bg-clip-content p-6 bg-green-600 border-dashed border-4 border-green-300"></div>
    </div>
    

</body>
</html>
