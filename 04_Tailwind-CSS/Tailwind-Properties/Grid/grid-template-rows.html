<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="text-center">
    <!-- 
    grid-rows-1: Each row concedes only one row.
        grid-rows-2: Each row concedes only two rows.
        grid-rows-3: Each row concedes only three rows.
        grid-rows-4: Each row concedes only four rows.
        grid-rows-5: Each row concedes only five rows.
        grid-rows-6: Each row concedes six rows.
        grid-rows-none: Does not follow the grid-row property.  -->

        <h1 class="text-4xl font-bold">Grid-row Class
        </h1>
            <div class="grid grid-rows-3 grid-flow-col">
                <div class="bg-green-300 rounded-lg m-4 h-12">1</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">2</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">3</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">4</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">5</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">6</div>
            </div><br>
        <h1 class="text-4xl font-bold">Grid-Rows Class
        </h1>
            <div class="grid grid-rows-2 grid-flow-col">
                <div class="bg-green-300 rounded-lg m-4 h-12">1</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">2</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">3</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">4</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">5</div>
                <div class="bg-green-300 rounded-lg m-4 h-12">6</div>
            </div>
</body>

</html>
