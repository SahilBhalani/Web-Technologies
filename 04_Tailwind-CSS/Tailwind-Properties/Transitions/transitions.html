<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Transitions</title>
</head>
<body>
    <h1 class="text-4xl font-bold">Tailwind CSS Transitions</h1>
    <div class="bg-green-200 m-8 grid grid-flow-col gap-4 p-5">

        <button class="transition duration-300 ease-in-out bg-green-300 hover:bg-green-600 transform hover:-translate-y-1 hover:scale-110 rounded-lg p-4 border border-green-900">Hover Me</button>

        <button class="transition-opacity duration-500 ease-in-out bg-green-300 hover:-translate-y-1 hover:scale-110 rounded-lg p-4 border border-green-900">Hover Me</button>

        <button class="transition-none duration-500 ease-in-out bg-green-300 hover:-translate-y-1 hover:scale-110 rounded-lg p-4 border border-green-900">Hover Me</button>
        
        <button class="transition-colors duration-500 ease-in-out bg-green-300 hover:bg-yellow-400 hover:scale-110 rounded-lg p-4 border border-green-900">Hover Me</button>
    </div>
