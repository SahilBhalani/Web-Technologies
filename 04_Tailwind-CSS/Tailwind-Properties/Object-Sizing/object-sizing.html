<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-sizing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1 class="text-black text-4xl font-bold">
        <div class="bg-green-300 mx-16 w-5xl space-y-4 p-2
        justify-between grid grid-rows-3 grid-flow-col">

        <img class="object-none object-left-top bg-green-200 w-24 h-24 border-4 my-4" src="./26-367x267.jpg" alt="">
        <img class="object-none object-left bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">
        <img class="object-none object-left-bottom bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">

        <img class="object-none object-top bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">
        <img class="object-none object-center bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">
        <img class="object-none object-bottom bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">

        <img class="object-none object-right-top bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">
        <img class="object-none object-right bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">
        <img class="object-none object-right-bottom bg-green-200 w-24 h-24 border-4 " src="./26-367x267.jpg" alt="">


    </div>
    </h1>
</body>
</html>
