<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Transform</title>
</head>
<body>
    <h1 class="text-4xl font-bold">Transform Class</h1>
    <div class="bg-green-300 mx-16 space-y-2 p-2 justify-between grid grid-rows-1 grid-flow-col">

        <div title="bg-left-top" class="bg-no-repeat w-16 h-16 my-4 transform skew-y-12" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>

        <div title="bg-left" class="bg-no-repeat w-16 h-16 my-4 transform rotate-45" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>

        <div title="bg-left-bottom" class="bg-no-repeat w-16 h-16 my-4 transform scale-50" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>

        <div title="bg-left-bottom" class="bg-no-repeat w-16 h-16 my-4 transform translate-x-4 translate-y-4" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>

    </div>
</body>
</html>
