<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Transform-Origin</title>
</head>
<body>
    <h1 class="text-4xl font-bold">Transform Origin</h1>
    <div class="bg-green-300 mx-16 p-4 justify-between grid grid-flow-col">

        <div class="bg-yellow-400 w-16 h-16">
            <div class="bg-no-repeat w-16 h-16 origin-center transform rotate-45" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>
        </div>
        <div class="bg-yellow-400 w-16 h-16">
            <div class="bg-no-repeat w-16 h-16 origin-top-left transform rotate-45" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>
        </div>
        <div class="bg-yellow-400 w-16 h-16">
            <div class="bg-no-repeat w-16 h-16 origin-bottom-right transform rotate-45" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>
        </div>
        <div class="bg-yellow-400 w-16 h-16">
            <div class="bg-no-repeat w-16 h-16 origin-left transform rotate-45" style="background-image: url(https://media.geeksforgeeks.org/wp-content/uploads/20210222211217/Screenshot20210222211207.png);"></div>
        </div>


    </div>
    
</body>
</html>
