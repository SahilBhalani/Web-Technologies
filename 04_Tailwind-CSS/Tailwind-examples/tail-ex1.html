<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link rel="stylesheet" href="style.css"> -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Tailwind Example</title>
</head>

<body>
  <div
    class="mx-auto flex max-w-sm items-center gap-x-4 rounded-xl bg-white p-6 shadow-lg outline outline-black/5 dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
    <img class="size-12 shrink-0 rounded-full"
      src="https://tailwindcss.com/_next/static/media/erin-lindford.90b9d461.jpg" alt="ChitChat Logo" />
    <div>
      <div class="text-xl font-medium text-black dark:text-white">ChitChat</div>
      <p class="text-gray-500 dark:text-gray-400">You ha9ve a new message!</p>
    </div>
  </div>

  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-6 sm:py-4">
    <img class="mx-auto flex-col h-24 rounded-full sm:mx-0 sm:shrink-0"
      src="https://tailwindcss.com/_next/static/media/erin-lindford.90b9d461.jpg" alt="pic">
    <div class="space-y-2 text-center sm:text-left">
      <div class="space-y-0.5">
        <p class="text-lg font-semibold text-black">Erin Lindford</p>
        <p class="font-medium text-gray-500">Product Engineer</p>
      </div>
      <button
        class="border border-purple-400 rounded-full px-4 py-1 text-purple-600 hover:border-transparent hover:bg-purple-600 hover:text-white active:bg-purple-700"
        type="button">Message</button>
    </div>
  </div>

</body>

</html>
