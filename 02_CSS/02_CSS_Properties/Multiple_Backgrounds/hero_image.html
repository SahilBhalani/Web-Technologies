<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero-img{
            background: url("https://www.w3schools.com/css/img_man.jpg") no-repeat center;
            height: 500px;
            position: relative;
            background-size: cover;
        }

        .hero-text{
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="hero-img">
        <div class="hero-text">
            <h1 style="font-size: 50px;">I am John Doe</h1>
            <h3>And I'm a Photographer</h3>
            <button>Hire me</button>
        </div>
    </div>

     <p>Page Content...</p>
        <p>Note: This technique will also make the image responsive: Resize the browser window to see the effect</p>
</body>
</html>
