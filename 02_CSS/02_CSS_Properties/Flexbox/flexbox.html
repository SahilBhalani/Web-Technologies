<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .parent{
            background-color: blueviolet;
            height: 30rem;
            width: 32rem;
            display: flex; /* For alligning element line by line */

            /* Horizontally Align Styling */
             justify-content: center;
             flex-direction: row;
             flex-wrap: wrap-reverse;
            
           /*  justify-content: flex-end;
            justify-content: last baseline;
            justify-content: space-around;
            justify-content: space-between; */

            /* Vertically Align Styling */
            align-items: center;
            align-items: flex-end;
            
        }

        .child{
            background-color: coral;
            border: 1px solid black;
            height: 6rem;
            width: 6rem;
            font-weight: bold;
            font-size: 2rem;
        }

        /* #one{
            align-self: center;
        }

        #two{
            align-self: flex-start;
        } */

        

    </style>
</head>
<body>
<div class="parent">
    <div class="child" id="one">Child 1</div>
    <div class="child" id="two">Child 2</div>
    <div class="child" id="three">Child 3</div>
</div>
    
</body>
</html>
