<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <style>

        /* Tooltip Container */
        .tooltip{
            position: relative;
            display: inline-block;
            border-bottom: 2px dotted black;
        }

        /* Tooltip Text */
        .tooltip-text{
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: #fff;
            text-align: center;
            padding: 5px 0;
            border-radius: 6px;

            position: absolute;
            z-index: 1;
            /* bottom:100%;
            left: 50%;
            margin-left: -60px; */
            top: -5px;
            left: 105%;
            opacity: 0;
            transition: opacity 1s;

        }

        .tooltip .tooltip-text::after{
            content: " ";
            position: absolute;
            top: 50%;
            right: 100%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color:  transparent black transparent transparent ;
        }
        
        /*Show the tool tip when you hover mouse on tooltip container */
        .tooltip:hover .tooltip-text{
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>Tooltip Example</h1><br><br><br>
    <div class="tooltip">Hover On Me!
        <span class="tooltip-text">Tooltip Text</span>
    </div>
</body>
</html>
