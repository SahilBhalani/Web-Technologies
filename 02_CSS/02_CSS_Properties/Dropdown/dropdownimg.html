<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .dropdown{
        position: relative;
        display: inline-block;
    }

    .dropdown-content{
        display: none;
        position: absolute;
        box-shadow:0px 8px 16px 0px rgba(0, 0, 0, 0.3);
        z-index: 1;
    }

    .dropdown:hover .dropdown-content{
        display: block;
    }

    .desc{
        text-align: center;
        padding: 15px;
    }
</style>
<body>
    <div class="dropdown">
        <img src="../Z_Index/leaf-nature-tree-png-20.png" alt="" width="100px">
        <div class="dropdown-content">
            <img src="../Z_Index/leaf-nature-tree-png-20.png" alt="" width="300px">
            <div class="desc">Beutifull Tree Image</div>
        </div>
    </div>
</body>
</html>
