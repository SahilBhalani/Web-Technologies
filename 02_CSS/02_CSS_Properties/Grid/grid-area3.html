<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area Example</title>
    <style>
        .grid-container{
            background-color: #0081a7;
            padding: 10px;
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 10px;
        }

        .grid-container > div{
            background-color: #f07167 ;
            color: #fed9b7;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }

        .item1{
            grid-area: 1 / 2;
            justify-self: right;
        }
        .item2{
            grid-area: 2 / 1;
        }
        .item3{
            grid-area: 2 / 3;
            justify-self: center;
        }
        .item4{
            grid-area: 2 / 2;
        }
        .item5{
            grid-area: 1 / 1;
        }
        .item6{
            grid-area: 1 / 3;
            
        }
        .item7{
            grid-area: 3 / 3;
        }
        .item8{
            grid-area: 3 / 1;
        }

        @media screen and (max-width:600px) {
            .item1{
            grid-area: 1 / span 5;
        }
        .item2{
            grid-area: 2 / span 5;
        }
        .item3{
            grid-area: 3 / span 4;
        }
        .item4{
            grid-area: 3 / 5;
        }
        .item5{
            grid-area: 4 / 1 / span 2;
        }
        .item6{
            grid-area: 4 / span 4;
        }

        .item7{
            grid-area: 5 / span 4;
        }

        .item8{
            grid-area: 6 / span 5;
        }


        }
    </style>
</head>
<body>
    <h1>Grid Area Layout</h1>
    <p>The grid items do not have to be displayed in the same order as they are written in the HTML code.</p>
    <div class="grid-container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item8">8</div>

    </div>
</body>
</html>
