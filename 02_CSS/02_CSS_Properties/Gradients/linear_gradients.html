<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradients</title>
</head>
<style>
    *{
        text-align: center;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
    }

    div{
        width: 200px;
        height: 150px;
        padding: 20px;
        margin: 25px;
    }

    .top-bot-grad{
        background-image: linear-gradient(red,yellow);
    }

    .left-right-grad{
        background-image: linear-gradient(to right, red, yellow);
    }

    .diagonal{
        background-image: linear-gradient(to bottom right,red,yellow);
    }

    .angles{
        background-image: linear-gradient(300deg,red,yellow);
    }

    .multiple-color-stops{
        background-image: linear-gradient(red,yellow,green);
    }

    .rainbow-grad{
        background-image: linear-gradient(to left,violet,indigo,blue,green,yellow,orange,red);
    }

    .transparency{
        background-image: linear-gradient(to right,rgba(255,0,0,0),rgba(255,0,0,1));
    }

    .repeat-grad {
        background-image: repeating-linear-gradient(red,yellow 10%,green 20%);
    }
</style>
<body>
    
    <div class="top-bot-grad">Top to Bottom(Default)</div>
    <div class="left-right-grad">Left to Right</div>
    <div class="diagonal">Top left to bottom right</div>
    <div class="angles">300Deg</div>
    <div class="multiple-color-stops">Multi Stop </div>
    <div class="rainbow-grad">Rainbow Gradient</div>
    <div class="transparency">Transparency</div>
    <div class="repeat-grad">Repeated</div>

</body>
</html>
