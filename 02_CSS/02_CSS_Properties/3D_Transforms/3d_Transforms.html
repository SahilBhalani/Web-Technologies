<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D_Transforms</title>
    <style>
        div{
            width: 200px;
            border: 2px solid black;
            background-color: yellow;
        }

        div.rotateX{
            transform: rotateX(150deg);
        }

        div.rotateY{
            transform: rotateY(150deg);
        }

        div.rotateZ{
            margin-top:100px;
            transform: rotateZ(90deg);
        }
    </style>
</head>
<body>
    <h1>The 3D Tranforms Methods:</h1>

    <div class="rotateX">This div is rotated 150 Degrees</div><br>

    <div class="rotateY">This div is rotated 150 degrees</div><br>

    <div class="rotateZ">This div is rotated at 90 degrees</div>

</body>
</html>
