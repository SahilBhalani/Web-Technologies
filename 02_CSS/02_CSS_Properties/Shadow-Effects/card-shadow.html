<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Shadow</title>
</head>

<style>
    div.polaroid{
        width: 250px;
        text-align: center;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2) , 0 6px 20px 0 rgba(0 , 0 ,0 , 0.19);
        float: left;
        position: relative;
    }

    div.container{
        padding: 10px;
    }

    div.card{
        width :250px;
        box-shadow: 0px 4px 8px 0 rgba(0, 0, 0, 0.2),0px 20px 8px 0 rgba(0 , 0 ,0 , 0.19) ;
        text-align: center;
        position: absolute;
        top: 1%;
        left: 30%;
    }

    div.header{
        background-color: green;
        font-size: 40px;
        color: white;
        padding: 10px;
    }
</style>
<body>
    <div class="polaroid">
        <img src="https://www.w3schools.com/css/rock600x400.jpg" alt="" style="width: 100%;">
        <div class="container">
            <p>Mountain Image</p>
        </div>
    </div>

<br><br>
    <div class="card">
        <div class="header">
            <h1>1</h1>
        </div>

        <div class="container">
            <p>January 1,2021</p>
        </div>
    </div>
</body>
</html>
