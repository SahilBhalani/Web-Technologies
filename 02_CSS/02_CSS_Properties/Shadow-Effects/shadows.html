<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Effects</title>
</head>
<style>
    h1{
        text-shadow: 2px 2px;
    }

    .red{
        text-shadow: 2px 2px red;
    }

    .blur{
        text-shadow: 2px 2px 5px red;
    }

    .white-black{
        text-shadow: 2px 2px 4px #000000;
        color: white;
    }

    .neon{
        text-shadow: 0 0 3px #ff0000;
    }

    .multiple{
        text-shadow: 0 0 3px red, 0 0 5px #0000ff;
    }

    .three{
        color: white;
        text-shadow: 1px 1px 2px black, 0 0 25px blue, 0 0 5px darkblue;
    }

    .border-text{
        color: aqua;
        text-shadow: -3px 0 black, 0 3px black , 3px 0 black,0 -3px black;
    }



</style>
<body>
    
    <h1>Text Shadows</h1>
    <h1 class="red">Text Shadows</h1>
    <h1 class="blur">Text Shadows</h1>
    <h1 class="white-black">Text Shadows</h1>
    <h1 class="neon">Text Shadows</h1>
    <h1 class="multiple">Text Shadows</h1>
    <h1 class="three">Text Shadows</h1>
    <h1 class="border-text">Border Around Text</h1>
</body>
</html>
