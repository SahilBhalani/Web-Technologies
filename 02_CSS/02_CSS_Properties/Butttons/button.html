<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styling</title>
    <style>
        .button{
            background-color: white;
            padding: 20px;
            text-align: center;
            font-size: 15px 32px;
            font-weight: bold;
            color: black;
            text-decoration: none;
            display:block;
            margin: 4px 2px;
            border: 2px solid green;
            border-radius: 50px;
            transition-duration: 0.4s;
            cursor: pointer;
            float: left;
        }

        .button:hover{
            background-color: green;
            color: white;
            box-shadow: 0 12px 16px 0 rgba(0, 0, 0, 0.24),0 17px 50px 0 rgba(0,0,0,0.19);
        }

        .disabled{
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <button style="margin: 10px;">Default Button</button>
    <button type="button" class="button" >CSS Button</button>
    <a href="#" class="button">Link Button</a>
    <input type="button" value="Input Button" class="button">
    <button disabled="disabled" class="disabled">Disabled Button</button>
</body>
</html>
