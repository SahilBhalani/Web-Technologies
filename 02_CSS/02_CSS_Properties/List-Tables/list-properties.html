<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    ul.a{
        list-style:decimal-leading-zero ;
    }

    ul.b{
        list-style:armenian;
    }

    ul.c{
        list-style-image: url('sqred.gif');
        list-style-type: square;
    }

    ol.d{
        list-style: lower-alpha;
        list-style-position: outside;
    }

    ol.e{
        list-style: upper-latin;
    }

    ol.f{
        list-style: upper-roman;
    }

</style>
<body>
    
    <p>Example of unordered list</p>
    <ul class="a">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coke</li>
    </ul>

    <ul class="b">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coke</li>
    </ul>

    <ul class="c">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coke</li>
    </ul>

    <p>Examples of Ordered List</p>
    <ol class="d">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coke</li>
    </ol> 
    <ol class="e">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coke</li>
    </ol> 
    <ol class="f">
    <li>Coffee</li>
    <li>Tea</li>
    <li>Coke</li>
    </ol> 

</body>
</html>
