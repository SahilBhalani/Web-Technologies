<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The @supports rule</title>
    <style>
        .container{
            float: left;
            width: 100%;
        }

        @supports(display: flex){
            .container{
                display: flex;
                background-color: dodgerblue;
            }
        }

        .container > div{
            background-color: white;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>The @supports rule</h1>
    <p>if the browser supports display:flex, the CSS inside the @supports fule will be applied. If not, the .container
        class outside the @supports will be applied:</p>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>

</html>
