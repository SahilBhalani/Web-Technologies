<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Refresh Data Every 5 Seconds</title>
</head>
<body>
    <p id="time"></p>
</body>
<script>
    setInterval(() => {
        fetch("https://worldtimeapi.org/api/ip")
        .then(res => res.json())
        .then(data => document.getElementById('time').innerHTML = data.datetime)
    } , 1000)
</script>
</html>
