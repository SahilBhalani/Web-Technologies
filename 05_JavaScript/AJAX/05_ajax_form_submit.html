<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax Form Submit Without Reload</title>
</head>
<body>
    <form id="myForm">
        <input type="text" name="name" placeholder="Enter Name">
        <button>Submit</button>
    </form> 
    <p id="response"></p>
</body>
<script>
    document.getElementById('myForm').onsubmit = e => {
        e.preventDefault();

        const formData = new FormData(e.target);

        fetch("https://jsonplaceholder.typicode.com/posts", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => document.getElementById('response').innerHTML = "Form Submitted!")
    };
</script>
</html>
