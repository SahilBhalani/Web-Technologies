<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Table rows</title>
</head>
<body>
    <table id="sampleTable" border="1">
        <tr>
            <td>Row1 Cell1</td>
            <td>Row1 Cell2</td>
        </tr>

        <tr>
            <td>Row2 Cell1</td>
            <td>Row2 Cell2</td>
        </tr>
    </table><br>
    <input type="button" value="Insert Row" onclick="insert_Row()">
</body>
<script>
    function insert_Row(){
        var x = document.getElementById('sampleTable').insertRow(0);

        var y = x.insertCell(0);
        var z = x.insertCell(1);

        y.innerHTML = "New Cell1"
        z.innerHTML = "New Cell2"
    }
</script>
</html>
