<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Link Attributes</title>
</head>
<body>
    <p><a id="w3r" type="text/html" hreflang="en-us" rel="nofollow" target="_self" href="https://www.w3resource.com/">w3resource</a></p>
    <button onclick="getAttributes()">Click here to get attributes of this link</button>
</body>
<script>
    function getAttributes(){
        alert('The value of the href attribute of the link is : ' + document.getElementById('w3r').href);
        alert('The value of the hreflang attribute of the link is : ' + document.getElementById('w3r').hreflang);
        alert('The value of the rel attribute of the link is : ' + document.getElementById('w3r').rel);
        alert('The value of the target attribute of the link is : ' + document.getElementById('w3r').target);
        alert('The value of the type attribute of the link is : ' + document.getElementById('w3r').type);
    }
</script>
</html>
