<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show A Paragraph</title>
</head>
<body>
    <h1>Show A Paragraph Onclick</h1>
    <p id="demo" style="display: none;">Hello World!</p>
    <button onclick="showPara()">Click To Show!</button>
</body>
<script>
    function showPara(){
        demo.style.display = "block";
    }
</script>
</html>
