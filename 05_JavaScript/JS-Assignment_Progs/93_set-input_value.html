<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Get Input Value</h1>
    Number: <input type="number" id="myNumber" /><br /><br />
    <button onclick="setValue()">Click Button To Set Value!</button>
  </body>

  <script>
    function setValue() {
      document.getElementById("myNumber").value = 25;
    }
  </script>
</html>
