<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade in an image</title>
</head>
<body>
    <h1>Fade in Image</h1>
    <button onclick="fadeIn()">Fade In Photo</button><br>
    <img src="https://picsum.photos/id/237/200/300" alt="img" id="img" style="opacity: 0;">
</body>
<script>
    function fadeIn() {
        img.style.opacity = 100;
        img.style.transition = "2s ease-in";
    }
</script>
</html>
