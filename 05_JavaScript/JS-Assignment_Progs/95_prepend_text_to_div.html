<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Prepend Text To a Div</h1>
     <div id="div1">
        <p id="p1">This is a paragraph.</p>
        <p id="p2">This is another paragraph.</p>
    </div><hr>
</body>
<script>
    document.getElementById('p2').prepend(document.createTextNode("This is New "));
</script>
</html>
