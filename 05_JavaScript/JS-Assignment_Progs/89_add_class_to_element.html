<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Class To Element</title>
</head>
<body>
    <h1>Add Class to P element</h1>
    <p id="demo">P element</p>
    <button onclick="addClass()">Click to add class to p element</button>
</body>
<script>
    function addClass(){
        const add = document.getElementById('demo');
        add.className += "Parraaaaa";
    }
</script>
</html>
