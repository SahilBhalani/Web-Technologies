<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove</title>
</head>
<body>
    <h1>Remove Element</h1>
    <p id="demo">Hey There!</p> <br>
    <button onclick="removeElem()">Click Here To Remove Element</button>
</body>
<script>
    function removeElem() {
        const elem = document.getElementById('demo');
        elem.remove();
    }
</script>
</html>
