<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty</title>
</head>
<body>
    <h1>Empty Element</h1>
    <p id="demo">Hey There!</p> <br>
    <button onclick="emptyElem()">Click Here To Empty Element</button>
</body>
<script>
    function emptyElem() {
        const elem = document.getElementById('demo');
        elem.replaceChildren();
    }
</script>
</html>
