<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Get Input Value</h1>
    Number: <input type="number" id="myNumber" value="2">
    <button onclick="getValue()">Get Value</button>
    <p id="demo"></p>
  </body>

  <script>
    function getValue() {
        let x = document.getElementById('myNumber').value;

        document.getElementById('demo').innerHTML = "The Value is: " + x;
    }
  </script>
</html>
