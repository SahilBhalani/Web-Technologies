<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Paragraph Visibility</title>
</head>
<body>
    <h1>Toggle Paragraph Visibility</h1>
    <p id="demo">Paragraph Visibility</p>
    <button onclick="showPara()">Show Paragraph</button>
    <button onclick="hidePara()">hide Paragraph</button>
</body>
<script>
    function showPara() {
        demo.style.visibility = "visible";
    }
    function hidePara() {
        demo.style.visibility = "hidden";
    }
</script>
</html>
