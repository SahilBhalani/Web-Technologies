<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <script src="js-control_flow.js"></script> -->
    <!-- <script src="js-callbacks.js"></script> -->
    <!-- <script src="js-asynchronous.js"></script> -->
    <!-- <script src="js-promises.js"></script> -->
    <script src="js-async-await.js"></script>
  </head>
  <body>
    <h1>Hey There!</h1>

    <p id="demo"></p>
    <p id="demo2"></p>
  </body>
  <script>
    {
      function myDisplayer(some) {
        document.getElementById("demo").innerHTML = some;
      }

      function getFile(myCallback) {
        let req = new XMLHttpRequest();
        req.onload = function () {
          if (req.status == 200) {
            myCallback(this.responseText);
          } else {
            myCallback("Error: " + req.responseText.status);
          }
        };
        req.open("GET", "asynchronus.html");
        req.send();
      }
      getFile(myDisplayer);
    }

    // Async Await
    {
      //* Waiting for a File
      async function getFile() {
        let myPromise = new Promise(function (resolve) {
          let req = new XMLHttpRequest();
          req.open("GET", "async.html");
          req.onload = function () {
            if (req.status == 200) {
              resolve(req.response);
            } else {
              resolve("File not Found");
            }
          };
          req.send();
        });
        document.getElementById("demo2").innerHTML = await myPromise;
      }
      getFile();
    }
  </script>
</html>
