<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Changing CSS</title>
</head>
<body>
    <!-- * Changing HTML Style 
    The following example changes the style of a <p> element: 
    -->
    <p id="p2">Hello World!</p>
    <script>
        document.getElementById('p2').style.color = "blue";
    </script>

    <!-- * Using Events 
    The HTML DOM allows you to execute code when an event occurs
    Events are generated by the browser when "things happen" to HTML elements:
    ~ An element is clicked on
    ~ The page has loaded
    ~ Input fields are changed

    This example changes the style of the HTML element with id="id1", when user clicks a button:
    -->
    <h1 id="id1">My heading 1</h1>
    <button type="button" onclick="document.getElementById('id1').style.color = 'red'">Click Me!</button>
</body>
</html>
