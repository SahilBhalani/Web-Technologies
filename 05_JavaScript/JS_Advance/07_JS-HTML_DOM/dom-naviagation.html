<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML DOM Navigation</title>
  </head>
  <body>
    <!-- * DOM Nodes 
    According to the W3c HTML DOM Standard, everything in an HTML document is a node:
    ~ The Entire document is a document node
    ~ Every HTML element is an element node
    ~ The text inside HTML elements are text nodes
    ~ Every HTML attribute is an attribute node (deprecated)
    ~ With the HTML DOM, all nodes in the node tree can be accessed by JavaScript
    ~ New nodes can be created, and all nodes can be modified or deleted. 
    -->

    <!-- * Node Relationship -->
    <!-- <html>
      <head>
        <title>DOM Tutorial</title>
      </head>

      <body>
        <h1>DOM Lesson one</h1>
        <p>Hello world!</p>
      </body>
    </html> -->

    <!-- From the HTML above you can read: 
    ~ <html> is the root node
    ~ <html> has no parents
    ~ <html> is the parent of <head> and <body>
    ~ <head> is the first child of <html>
    ~ <body> is the last child of <html>

    AND
    
    ~ <head> has one child: <title>
    ~ <title> has one child (a text node): "DOM Tutorial"
    ~ <body> has two children: <h1> and <p>
    ~ <h1> has one child: "DOM Lesson one"
    ~ <p> has one child: "Hello world!"
    ~ <h1> and <p> are siblings.                    
    -->

    <!-- * Navigating Between Nodes 
    You can use the following node properties to navigate between nodes with JavaScript:
    ~ parentNode
    ~ childNodes[nodenumber]
    ~ firstChild
    ~ lastChild
    ~ nextSibling
    ~ previousSibling 
    -->

    <!-- * Child Nodes and Node Values  
    A Common error in DOM processing is to expect an element node to contain text. 
    -->
    <title id="demo">DOM Tutorial</title>
    <!-- The element node <title> does not contain text. 
         It contains a text node with the value "DOM Tutorial".   
    -->

    <!-- The value of the text node can be accessed by the node's innerHTML property -->
    <!-- myTitle = getElementById("demo").innerHTML; -->

    <!-- Accessing the innerHTML property is the same as accessing the nodeValue of the first child: -->
    <!-- myTitle = getElementById("demo").firstChild.nodeValue; -->

    <!-- Accessing the first child can also be done like this: -->
    <!-- myTitle = getElementById("demo").childNodes[0].nodeValue;  -->

    <!-- ? Example -->
    <h1 id="id01">My First Page</h1>
    <p id="id02"></p>
    <script>
      {
        document.getElementById("id02").innerHTML =
          document.getElementById("id01").innerHTML;
      }
    </script>


    <h1 id="id1">My First Page</h1>
    <p id="id2">Hello!</p>
    <script>
        {
            document.getElementById('id2').innerHTML = 
            document.getElementById('id1').childNodes[0].nodeValue;
        }
    </script>


    <!-- * InnerHTML  
         * DOM Root Nodes 
         There are two special properties that allow access to the full document
    -->
    <p id="demo1"></p><hr>
    <script>
        {
            document.getElementById('demo1').innerHTML = document.body.innerHTML; //You can also use document.documentElement.innnerHTML
        } 
    </script>

    <!-- * The nodeName Properety 
    The nodeName property specifies the name of a node
    ~ nodeName is read-only
    ~ nodeName of an element node is the same as the tage name
    ~ nodeName of an attribute node is the attribute name
    ~ nodeName of a text node is always #text
    ~ nodeName of the document node is always #document 
    -->
    <h1 id="id11">The nodeName Property</h1>
    <p id="id22"></p><hr>
    <script>
        document.getElementById('id22').innerHTML = 
        document.getElementById('id11').nodeName;
    </script>
    <!-- ? NOTE: nodeName always contains the uppercase tag name of an HTML element -->

    <!-- * The nodeValue Property 
    The nodeValue property specifies the value of a node.
    ~ nodeValue for element nodes is null
    ~ nodeValue for text nodes is the text itself
    ~ nodeValue for attribute nodes is the attribute value 
    -->

    <!-- * The nodeType Property 
    The nodeType property is read only. it returns the type of a node. 
    -->
    <h1 id="i1">The nodeType Property</h1>
    <p id="i2"></p>
    <script>
        document.getElementById('i2').innerHTML = 
        document.getElementById('i1').nodeType;
    </script>

    <!-- ? The most important nodeType properties are: 
    Node            Type    Example
    ELEMENT_NODE    1       <h1 class="heading">W3SC</h1>
    ATTRIBUTE_NODE  2       class = "heading"(deprecated)
    TEXT_NODE       3       W3Schools
    COMMENT_NODE    8       //This is a comment
    DOCUMENT_NODE   9       The HTML document itself.
    DOCUMENT_TYPE   10      <!Doctype html>
    _NODE

    -->


  </body>
</html>
