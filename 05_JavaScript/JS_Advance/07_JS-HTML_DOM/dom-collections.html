<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML DOM Collection</title>
</head>
<body>
    <!-- * The HTMLCollection Object 
    The getElementByTagName() method returns an HTMLCollection object.
    An HTMLCollection object is an array-like list(collection) of HTML elements. 
    -->
    <p>Hello World!</p>
    <p>Hello Milano!</p>
    <p id="demo"></p>
    <p id="demo1"></p>
    <button onclick="myFunction()">Try It!</button>
    <script>
        const myCollection = document.getElementsByTagName('p');

        document.getElementById('demo').innerHTML = "The innerHTML of the second paragraph is: " + myCollection
        [1].innerHTML;

        //HTML Collection Length
        document.getElementById('demo1').innerHTML = "The Document contains " + myCollection.length + " Paragraphs!";

        //The length property is useful when you want to loop though the elementa in a collection:
        function myFunction() {
            for(let i = 0; i < myCollection.length; i++) {
                myCollection[i].style.color = "red";
            }
        }
    </script>

    <!-- * An HTMLCollection is NOT an array! 
    An HTMLCollection may look like an array, but it is not.
    You can loop through the list and refer to the elements with a number (just like an array)
    However, you cannot use array methods like valueOf(), pop(), push(), or join() on an HTMLCollection. 
    -->
</body>
</html>
