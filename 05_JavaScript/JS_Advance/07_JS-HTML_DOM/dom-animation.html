<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML DOM Animation</title>
</head>
<style>
    #container {
        width: 400px;
        height: 400px;
        position: relative;
        background: yellow;
    }

    #animate{
        width: 50px;
        height: 50px;
        position: absolute;
        background: red;
    }
</style>
<body>
    <!-- * Animation Code 
    JavaScript Animations are done by programming gradual changes in an element's style.
    The changes are called by a timer. When a timer interval is small, the animation looks continous;  
    -->
     <p><button onclick="myMove()">Click Me</button></p>

     <div id="container">
        <div id="animate"></div>
     </div>

     <script>
        function myMove() {
            let id = null;
            const elem = document.getElementById('animate');
            let pos = 0;
            clearInterval(id);
            id = setInterval(frame, 5);

            function frame() {
                if (pos == 350) {
                    clearInterval(id);
                } else { 
                    pos++;
                    elem.style.top = pos + "px";
                    elem.style.left = pos + "px";
                }
            }

        }
     </script>
</body>
</html>
