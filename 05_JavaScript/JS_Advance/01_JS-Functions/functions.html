<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Functions</title>
    <!-- <script src="js-functions_Definitions.js"></script> -->
    <!-- <script src="js-arrow-functions.js"></script> -->
    <!-- <script src="js-function_invoking.js"></script> -->
    <!-- <script src="js-function-this.js"></script> -->
    <!-- <script src="js-function_call.js"></script> -->
    <!-- <script src="js-function_apply.js"></script> -->
    <script src="js-function-bind.js"></script>
  </head>
  <body>
    <!-- <button id="btn">Click Me!</button> -->
    <button id="btn2">Click Me!</button>
    <p id="demo2"></p>

    <!-- * this in Event Handlers -->
    <!-- In HTML event handlers, this refers to the html element that received the event: -->
    <button onclick="this.style.display='none'">Click to Remove Me!</button>

    <p id="demo"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
  </body>
  <script>
    // let x = this;
    // document.getElementById('demo2').innerHTML = x;
    {
      //Preserving This
      const person = {
        firstName: "John",
        lastName: "Doe",
        display: function () {
          let x = document.getElementById("demo");
          x.innerHTML = this.firstName + " " + this.lastName;
        },
      };

      person.display();
    }

    {
      //Example 2
      const person = {
        firstName: "Gojo",
        lastName: "Satoru",
        display: function () {
          let x = document.getElementById("demo3");
          x.innerHTML = this.firstName + " " + this.lastName;
        },
      };

      setTimeout(person.display(), 3000);
    }

    {
    //This example will display the person name after 3 seconds:
    const person = {
        firstName: "Yuji",
        lastName: "Itadori",
        display: function() {
           let x = document.getElementById('demo4'); 
           x.innerHTML = this.firstName + " " + this.lastName;
        }
    }

    let display = person.display.bind(person);
    setTimeout(display, 3000);
}
  </script>
</html>
