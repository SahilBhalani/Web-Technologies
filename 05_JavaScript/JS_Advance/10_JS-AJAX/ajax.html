<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJAX Introduction</title>
    <!-- <script src="the_XMLHttpsRequest_object.js"></script>
    <script src="ajax-request.js"></script> -->
    <script src="ajax-server-response.js"></script>
  </head>
  <body>
    <!--  * AJAX Introduction 
      AJAX is a developer's dream, because you can:
      ~ Read data from a web server - after the page has loaded
      ~ Update a web page without reloading the page
      ~ Send data to a web server - in the background

      ? AJAX is a technique for accessing web servers from a web page.
    -->

    <div id="demo">
        <h2>Let AJAX Change this text</h2>
        <button type="button" onclick="loaddoc()">Change Content</button>
    </div>
    <!-- The HTML page contains a <div> section and a <button>
         The <div> section is used to display information from a server.
         The <button> calls a function (if it's clicked).
         The function request data from a web server and displays it:   
        -->

      <script>
        function loaddoc() {
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                document.getElementById('demo').innerHTML = this.responseText;
            }
            xhttp.open("GET", "ajax_info.txt", true);
            xhttp.send();
        }
      </script>  

      <!-- * What is AJAX? 
       AJAX allows web pages to be updated asynchronously by exchanging data with a web server behind the scenes. this means that it is possible to update parts of a web page, without reloading the whole page.
      -->

      <hr>

      <h2>The XMLHttpRequest Object</h2>
      <button type="button" onclick="loadDoc()">Request Data</button>
      <p id="d1"></p><hr>

      <h2>The POST Method</h2>
      <button type="button" onclick="loadPost()">Request Data</button>
      <p id="d2"></p><hr>
      <button type="button" onclick="loadsync()">Change Content</button>
      <p id="d3">Let's change this text</p><hr>

      <h2>The XMLHttpRequest object</h2>
      <p id="pp1"></p>
  </body>
</html>
