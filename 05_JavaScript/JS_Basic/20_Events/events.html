<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events</title>
</head>
<body>
    <!-- HTML Events are "Things" that happen to HTML elements.
     When JavaScript is used in HTML pages, JavaScript can "React" on these events.  
     -->

     <!--  * HTML Events
     An HTML event can be something the browser does, or something a user does.
     Here are Some Examples of HTML events:
     ~ An HTML web page has finished loading
     ~ An HTML input field was changed
     ~ An HTML button was clicked 

     Often, When events happen, you may want to do something
     JavaScript lets you execute code eventss are detected.
     -->

     <!-- HTML allows event handler attributed, with JavaScript code, to be added to HTML elements. -->

     <!-- With single quotes: -->
      <element event='Some JavaScript'></element>

     <!-- With double quotes: -->
      <element event="Some JavaScript"></element>

      
      <!-- In the following example, an onclick attribute(with code), is added to a <button> element: -->
        <button onclick="document.getElementById('demo').innerHTML = Date();">The Time is ?</button>
        <p id="demo"></p>

        <!-- In the next example, the code changes the content of its own element(using this.innerHTML) -->
         <button onclick="this.innerHTML = Date()">The Time is?</button>

         <!-- JavaScript code is often several lines long. it it more common to see event attributes calling functions:
           -->
         <button onclick="displayDate()">The time is?</button>
         <p id="demo2"></p>


        <!-- * Common HTML Events 
         Events            Description
         onchange          An HTML element has been changed
         onclick           The user clicks an HTML element
         onmouseover       The user moves the mouse over an HTML element
         onmouseout        The user moves the mouse away from an HTML element
         onkeydown         The user pushes a keyboard key
         onload            The browser has finished loading the page
         -->

         <!-- * JavaScript Event Handlers -->
         <!-- 
          ? Event handlers can be used to handle and verify user input, user actions, and browser actions:
          ~ Things that should be done every time a page loads
          ~ Things that should be done when the page is cloased
          ~ Action that should be performed when a user clicks a button
          ~ Content that should be verified when a user inputs data -->

          <!-- 
          ? Many different methods can be used JavaScript work with events
          ~ HTML event attribute can execute JavaScript code directly
          ~ HTML events attributes can call JavaScript functions
          ~ You can assign your own event handler function to HTML elements
          ~ You can prevent events from being sent or being handled. 
          -->
</body>
<script>
    function displayDate(){
        document.getElementById('demo2').innerHTML = Date();
    }
</script>
</html>
