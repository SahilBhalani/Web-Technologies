<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Power Without Using pow</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function power(base, exp){
        let result = 1;
        for(let i = 1; i <= exp; i++){
            result = result * base;
        }
        return result;
    }
    document.getElementById('demo').innerHTML = power(2,4);
</script>
</html>
