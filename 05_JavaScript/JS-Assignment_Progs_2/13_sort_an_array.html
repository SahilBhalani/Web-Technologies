<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort an Array ascending and decending</title>
</head>
<body>
    <p id="demo"></p>
    <p id="demo2"></p>
</body>
<script>
    let arr = [6,9,1,2,7,0,-1,5];
    document.getElementById('demo').innerHTML = "Ascending Sort: " + arr.sort();
    document.getElementById('demo2').innerHTML = "Descending Sort: " + arr.sort().reverse();
</script>
</html>
