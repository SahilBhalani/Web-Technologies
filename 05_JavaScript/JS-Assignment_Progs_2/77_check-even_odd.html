<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function to Check Even or Odd</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function isEvenorOdd(num){
        return num % 2 === 0 ? "Even" : "Odd";
    }

    document.getElementById('demo').innerHTML = isEvenorOdd(7);
</script>
</html>
