<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await Example</title>
</head>
<body>
    <h1>Async Await Example</h1>
    <p id="demo"></p>
</body>
<script>
    function multiply(value){
        return new Promise((resolve, reject) => {
            resolve(value * 2);
        })
    }

    async function result(){
        let result1 = await multiply(5);
        let result2 = await multiply(result1);
        return result2;
    }

    result().then((finalResult) => {
        document.getElementById('demo').innerHTML = "Final Result: " + finalResult;
    })
</script>
</html>
