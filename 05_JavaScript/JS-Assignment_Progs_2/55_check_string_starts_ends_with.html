<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check if string starts/ ends with a substring</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    const checkStr = (str) => (str.startsWith("Hi") && str.endsWith("Bhalani") ? true : false);

    document.getElementById('demo').innerHTML = checkStr("Hi My Name is Sahil Bhalani");
  </script>
</html>
