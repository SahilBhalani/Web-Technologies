<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difference Of Two Arrays</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function differenceArray(arr1,arr2){
        return arr1.filter(value => !arr2.includes(value));
    }
    document.getElementById('demo').innerHTML = JSON.stringify(differenceArray([1,2,3], [3,4,5]));
</script>
</html>
