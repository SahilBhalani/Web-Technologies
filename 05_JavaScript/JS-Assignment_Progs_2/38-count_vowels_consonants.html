<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Count Vowels & Consonants</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    function countVowelsConsonants(str) {
      const vowelCount = str.match(/[aeiouAEIOU]/g).length;
      const consoCount = str.length - vowelCount;

      return "Vowels : " + vowelCount + "<br>" + "Consonants : " + consoCount;
    }

    document.getElementById('demo').innerHTML = countVowelsConsonants("Hey There Sahil Bhalani Here");
  </script>
</html>
