<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jquery Hide Show Element</title>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <h1>Jquery Hide Show Element</h1>
    <button id="hideBtn">Hide Text</button>
    <button id="showBtn">Show Text</button>
    <p id="demo">This is a Sample Text to hide and show element using Jquery.</p>
</body>
<script>
    $(document).ready(function(){
        $("#hideBtn").click(function(){
            $("#demo").hide()
        })
        $("#showBtn").click(function(){
            $("#demo").show()
        })
    })
</script>
</html>
