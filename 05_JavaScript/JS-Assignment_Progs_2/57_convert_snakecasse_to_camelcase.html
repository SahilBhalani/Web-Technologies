<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert SnakeCase into CamelCase</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function snakeToCamel(str){
        return str.replace(/_([a-z])/g, function(g) { return g[1].toUpperCase(); });
    }

    document.getElementById('demo').innerHTML = snakeToCamel("hello_world_this_is_sahil");
</script>
</html>
