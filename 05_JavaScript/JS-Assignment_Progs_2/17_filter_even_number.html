<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Even Numbers From an Array</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
    let evenNumbers = (nums) => nums.filter((num) => num % 2 == 0);

    document.getElementById('demo').innerHTML = evenNumbers(nums);
  </script>
</html>
