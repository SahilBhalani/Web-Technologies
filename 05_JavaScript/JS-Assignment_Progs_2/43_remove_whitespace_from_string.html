<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove Whitespaces From a String</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    function removeAllWhitespaces(str) {
      return str.replace(/\s+/g, "");
    }
    document.getElementById('demo').innerHTML = removeAllWhitespaces("Hey    There   Sahil   Here");
  </script>
</html>
