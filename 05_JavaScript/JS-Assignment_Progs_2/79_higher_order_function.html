<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher Order Example</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function greet(name){
        return "Hello, " + name + "!";
    }

    function userInput(callback){
        const name = "Sahil";
        return callback(name)
    }

    document.getElementById('demo').innerHTML = userInput(greet);
</script>
</html>
