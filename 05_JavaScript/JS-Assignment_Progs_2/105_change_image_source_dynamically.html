<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Image Source Dynamically</title>
</head>
<body>
    <h1>Change Image Source Dynamically</h1>
    <img id="myImage" src="https://picsum.photos/id/237/200/300" alt="Placeholder Image">    
    <br><br>
    <button onclick="changeImage()">Change Image</button>
</body>
<script>
    function changeImage(){
        const image = document.getElementById('myImage');
        image.src = "https://picsum.photos/id/238/200/300";
    }
</script>
</html>
