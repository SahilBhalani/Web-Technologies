<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Click Example</title>
</head>
<body>
    <h1>Double Click Example</h1>
    <p id="demo">Double Click Here!!!</p>
</body>
<script>
    const demo = document.getElementById('demo');

    demo.addEventListener('dblclick', 
        function(){
            demo.style.color = 'red';
        }
    )
</script>
</html>
