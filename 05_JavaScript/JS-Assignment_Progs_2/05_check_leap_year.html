<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Leap Year</title>
  </head>
  <body>
    <p id="demo"></p>
    <p id="demo2"></p>
  </body>
  <script>
    const leapyear = (year) => {
      return year % 100 === 0 ? year % 400 === 0 : year % 4 === 0;
    };

    document.getElementById('demo').innerHTML = leapyear(2016);
    document.getElementById('demo2').innerHTML = leapyear(2025);
  </script>
</html>
