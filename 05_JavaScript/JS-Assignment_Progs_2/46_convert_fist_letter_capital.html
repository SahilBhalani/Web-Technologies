<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert First Letter into Captital</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let str = "sahil bhalani";
    document.getElementById('demo').innerHTML = str.charAt(0).toUpperCase() + str.slice(1);
</script>
</html>
