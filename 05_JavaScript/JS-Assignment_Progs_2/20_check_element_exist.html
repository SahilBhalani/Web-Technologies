<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if element exists in an array</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>

    let arr = [1,2,3,4,5];
    document.getElementById('demo').innerHTML = arr.includes(6);
</script>
</html>
