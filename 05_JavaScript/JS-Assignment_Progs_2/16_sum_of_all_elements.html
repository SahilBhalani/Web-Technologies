<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of All Elements</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let arr = [1,2,3,4,5];

    let sum = 0;

    for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
    } 

    document.getElementById('demo').innerHTML = `The Sum of all elements is: ${sum}`;
    
</script>
</html>
