<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract Numbers From Strings</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function extract(str){
        return str.match(/\d+/g).map(Number);
    }

    document.getElementById('demo').innerHTML = JSON.stringify(extract("Sahil 1 Bhalani 2 Here 3"));
</script>
</html>
