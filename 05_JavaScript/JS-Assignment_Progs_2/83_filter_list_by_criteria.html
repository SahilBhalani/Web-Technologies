<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function To Filter List By Criteria</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    function filterList(arr, criteria){
        return arr.filter(item = item => item > criteria)
    }
    const numbers = [10, 25, 30, 45, 60, 75, 90];
   

    document.getElementById('demo').innerHTML = filterList(numbers, 50);
  </script>
</html>
