<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Returning Another Function</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    function outerFunction() {
      function innerfunction() {
        return "Hello from the inner Fucntion!";
      }
      return innerfunction;
    }

    document.getElementById("demo").innerHTML = outerFunction()();
  </script>
</html>
