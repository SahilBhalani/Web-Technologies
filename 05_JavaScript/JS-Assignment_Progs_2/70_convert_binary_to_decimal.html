<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert Binary To Decimal</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    function binToDec(bstr) {
      return parseInt((bstr + '').replace(/[^01]/gi, ''), 2);
    }
    document.getElementById('demo').innerHTML = binToDec('1010');
  </script>
</html>
