<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Occurences of Each Element</title>
</head>
<body>
    <p id="demo">
    </p>
</body>
<script>
    function countFrequency(arr){
    let freq = {};
    for(let i = 0; i < arr.length; i++){
        if(freq[arr[i]]){
            freq[arr[i]] += 1;
        } else {
            freq[arr[i]] = 1;
        }
    }
    return freq;
}

let result = countFrequency([1,2,2,3,4,4,4,5,1,1,1,2]);
document.getElementById('demo').innerHTML = JSON.stringify(result);

</script>
</html>
