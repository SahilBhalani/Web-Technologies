<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check if string contains substring</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let str = "Hey There! Sahil Here";
    let substring = "Sahil";
    document.getElementById('demo').innerHTML = str.includes(substring);
</script>
</html>
