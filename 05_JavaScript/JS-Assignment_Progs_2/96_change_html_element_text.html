<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change HTML element text dynamically</title>
</head>
<body>
    <h1>Change HTML element text dynamically</h1>
    <p id="demo">Hey There!</p>
    <button onclick="change()">Click To Change Text!</button>
</body>
<script>
    function change(){
        document.getElementById('demo').innerHTML = "Hey There, Sahil Here!";
    }
</script>
</html>
