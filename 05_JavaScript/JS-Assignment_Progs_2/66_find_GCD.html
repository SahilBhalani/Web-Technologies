<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find GCD Of two numbers</title>
</head>
<body>
    <p id="demo">
    </p>
</body>
<script>
    function findGCD(a,b){
        while(b){
            let temp = b;
            b = a % b;
            a = temp;
        }
        return a;
    }

    document.getElementById('demo').innerHTML = findGCD(54, 81);
</script>
</html>
