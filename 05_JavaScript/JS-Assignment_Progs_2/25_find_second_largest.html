<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Second Largest Number</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    const arr = [10, 5, 8, 20, 15, 30, 25];

    function findSecondLargest(arr) {
      let first = -Infinity,
        second = -Infinity;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > first) {
          second = first;
          first = arr[i];
        } else if (arr[i] > second && arr[i] != first) {
          second = arr[i];
        }
      }
      return second;
    }

    const secondLargestNumber = findSecondLargest(arr);
    document.getElementById("demo").innerHTML =
      "The second largest number is: " + secondLargestNumber;
  </script>
</html>
