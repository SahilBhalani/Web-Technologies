<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of digits of a number</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function sumOfDigits(num) {
        let sum = 0;
        while(num > 0){
            let digit = num % 10;
            sum += digit;
            num = Math.floor(num / 10)
        }
        return sum;
    }
    document.getElementById('demo').innerHTML = sumOfDigits(12345);
</script>
</html>
