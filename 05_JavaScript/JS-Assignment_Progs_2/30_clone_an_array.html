<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone an Array</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let ogArr = [1,2,3,4,5,6];
    let clonedArr = ogArr.slice();
    document.getElementById('demo').innerHTML = "Original Array: " + ogArr + "<br> Cloned Array: " + clonedArr;
</script>
</html>
