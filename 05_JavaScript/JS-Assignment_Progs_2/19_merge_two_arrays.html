<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merger Two Arrays</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let arr1 = [1,2,3];
    let arr2 = [4,5,6];

    let mergedArray = [...arr1,...arr2];
    document.getElementById('demo').innerHTML = mergedArray;
</script>
</html>
