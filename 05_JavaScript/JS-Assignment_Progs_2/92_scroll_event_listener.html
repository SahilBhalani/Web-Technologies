<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Event Listener</title>
  </head>
  <body>
    <h1>Scroll Event Listener</h1>
    <div style="height: 1500px">
      <p>Scroll down this page to see the event listener in action.</p>
    </div>
  </body>
  <script>
    window.addEventListener("scroll", function () {
      console.log("You are scrolling the page!");
    });
  </script>
</html>
