<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form submit using Ajax</title>
</head>
<body>
    <h1>Form Submit using Ajax</h1>
    <form id="myForm">
        Name: <input type="text" name="name" required><br><br>
        Email: <input type="email" name="email" required><br><br>
        <input type="submit" value="Submit">
    </form>
    <div id="result"></div>
</body>
<script>
    document.getElementById('myform').addEventListener('submit', function(event) {
        event.preventDefault();
        const formData = new FormData(this);
        fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').innerHTML = "Form submitted successfully !<br>" + JSON.stringify(data);
            alert("Form submitted successfully!\nResponse: " + JSON.stringify(data));
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Error submitting form: " + error);
        });
    });
</script>
</html>
