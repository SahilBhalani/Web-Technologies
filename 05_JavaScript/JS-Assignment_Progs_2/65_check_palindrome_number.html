<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Number is Palindrome</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
function isPalindrome(num){
    let originalNum = num;
    let reversedNum = 0;
    while(num > 0){
        let digit = num % 10;
        reversedNum = reversedNum * 10 + digit
        num = Math.floor(num / 10);
    }
    return originalNum === reversedNum
}
document.getElementById('demo').innerHTML = isPalindrome(1234321);

</script>
</html>
