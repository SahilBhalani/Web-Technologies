<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split and convert string to array</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    const fruitsString = "Apple,Banana,Mango,Orange,Pineapple";
    const fruitsArray = fruitsString.split(",");
    document.getElementById("demo").innerHTML =
      "String converted into Array: " + fruitsArray;
  </script>
</html>
