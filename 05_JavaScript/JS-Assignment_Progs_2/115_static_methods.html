<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Methods</title>
</head>
<body>
    <h1>Static Methods</h1>
    <p id="demo"></p>
</body>
<script>
    class mathOperations{
        static add(a, b){
            return a + b;
        }
    }
    const sum = mathOperations.add(5,10);
    document.getElementById('demo').innerHTML = "Sum: " + sum;

</script>
</html>
