<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replace Substring in String</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let str = "Hey There! 'Sahil here'";
    document.getElementById('demo').innerHTML = str.replace("Sahil", "Bhalani");
</script>
</html>
