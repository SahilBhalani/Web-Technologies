<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function Example</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    const addNumbers = (a,b) => a + b;
    document.getElementById('demo').innerHTML = addNumbers(10,12);
</script>
</html>
