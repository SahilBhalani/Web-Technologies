<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Words From String</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function countWords(str){
        return str.trim().split(/\s+/).length;
    }

    document.getElementById('demo').innerHTML = countWords("Hey There Sahil Here");
</script>
</html>
