<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeat a String N Times</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let str = "Sahil Bhalani ";
    let n = 3;
    document.getElementById('demo').innerHTML = str.repeat(n);
</script>
</html>
