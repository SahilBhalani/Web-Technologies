<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch JSON using jQuery AJAX</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <h1>fetch JSON using jQuery AJAX</h1>
    <button id="fetchBtn">Click here to Fetch JSON Data</button>
    <div id="jsonData"></div>
</body>
<script>
    $(document).ready(function (){
        $("#fetchBtn").click(function (){
            $.ajax({
                url: "https://jsonplaceholder.typicode.com/users",
                method: "GET",
                dataType: "json",
                success: function (data, status){
                    let output = "<h2>Fetched JSON Data:</h2><ul>";
                    data.forEach(function(user){
                        output += `<li>${user.name} (${user.email})</li>`;
                    });
                    output += "</ul>";
                    $("#jsonData").html(output);
                    alert("Data fetched successfully!\nStatus: " + status);
                },
                error: function (xhr, status, error){
                    alert("Error fetching data: " + error);
                }
            });
        });
    })
</script>
</html>
