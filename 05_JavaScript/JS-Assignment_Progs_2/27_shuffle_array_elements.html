<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuffle Array Elements</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1))
        let temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
    }
    return arr;
}

document.getElementById('demo').innerHTML = shuffle([1,2,3,4,5,6]);
</script>
</html>
