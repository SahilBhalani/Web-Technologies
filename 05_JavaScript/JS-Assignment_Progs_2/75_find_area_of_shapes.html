<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finf Area Of Circle, Square, Triangle</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function areaCircle(r){
        return (3.14 * r * r).toFixed(2);
    }

    function areaSquare(s){
        return (s * s).toFixed(2);
    }

    function areaTriangle(b,h){
        return (0.5 * b * h).toFixed(2);
    }
</script>
</html>
