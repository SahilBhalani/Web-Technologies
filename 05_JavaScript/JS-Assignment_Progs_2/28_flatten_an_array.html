<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flatten an Array</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function flattenArray(arr) {
    let result = [];
    for(let i = 0; i < arr.length; i++){
        if(Array.isArray(arr[i])){
            result = result.concat(flattenArray(arr[i]));
        } else {
            result.push(arr[i]);
        }
        }
        return result;
    }

let nestedArray = [1, [2, [3, 4], 5], 6, [7, 8]];
document.getElementById('demo').innerHTML = flattenArray(nestedArray);
</script>
</html>
