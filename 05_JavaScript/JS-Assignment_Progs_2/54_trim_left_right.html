<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trim Left & Right</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function trimLeftRight(str){
        return str.replace(/^\s+|\s+$/g, '');
    }

    document.getElementById('demo').innerHTML = trimLeftRight("            Hello World!   ");
</script>
</html>
