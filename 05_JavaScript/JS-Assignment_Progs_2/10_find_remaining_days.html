<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Remaining Days In a Current Year</title>
  </head>
  <body>
    <p id="demo"></p>
  </body>
  <script>
    const today = new Date();
    const newyear = new Date(2025, 11, 31);

    const one_day = 1000 * 60 * 60 * 24;
    let diff =
      Math.ceil((newyear.getTime() - today.getTime()) / one_day) +
      " Days Remaining In The Current Year!";
    document.getElementById("demo").innerHTML = diff;
  </script>
</html>
