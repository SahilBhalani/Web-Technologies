<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Fibonacci Series</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function genFibonacci(n){
        let fib = [0, 1];
        for(let i = 2; i < n; i++){
            fib[i] = fib[i - 1] + fib[i - 2];
        }
        return fib.slice(0, n); 
    }
    document.getElementById('demo').innerHTML = JSON.stringify(genFibonacci(10));
</script>
</html>
