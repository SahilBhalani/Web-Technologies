<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Class On Element</title>
  </head>
  <body>
    <h1>Toggle Class In Element</h1>
    <p id="demo">Add Classss!!!!</p>
    <button onclick="addClass()">Click To Add Class</button>
  </body>
  <script>
    function addClass() {
      const demo = document.getElementById("demo");
      demo.classList.toggle("myClass");
      if (demo.classList.contains("myClass")) {
        demo.innerHTML = "Class Added!";
      } else {
        demo.innerHTML = "Class Removed!";
      }
    }
  </script>
</html>
