<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function with Default parameters</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function greet(name = "Sahil"){
        return "Hello, " + name + "!";
    }

    document.getElementById('demo').innerHTML = greet();
</script>
</html>
