<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get The Day Name From Date</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
     let today = new Date();
    const day = today.getDay();

    
    const daylist = [
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
    ];

    let currentDay = "The Day Is: " + daylist[day];

    document.getElementById('demo').innerHTML = currentDay;
</script>
</html>
