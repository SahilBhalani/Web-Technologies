<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert String to Uppercase</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    let str = " hey there sahil bhalani";
    document.getElementById('demo').innerHTML = str.toUpperCase();
</script>
</html>
