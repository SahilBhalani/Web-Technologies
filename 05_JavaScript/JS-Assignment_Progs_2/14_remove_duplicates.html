<!DOCTYPE html>

  <body>
    <p id="demo"></p>
  </body>
  <script>
    function removeDuplicates(arr) {
      return [...new Set(arr)];
    }

    document.getElementById('demo').innerHTML = removeDuplicates([1,2,3,3,4,4,2,5,6,5,6,7,8]);
  </script>
