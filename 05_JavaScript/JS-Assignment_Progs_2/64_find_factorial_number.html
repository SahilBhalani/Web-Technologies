<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Factorial of Number</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function factorial(num){
        if(num < 0) return -1;

        if(num === 0) return 1;
        return num * factorial(num-1);
    }

    document.getElementById('demo').innerHTML= factorial(5);
</script>
</html>
