<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function Example</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function square(num){
        return num * num;
    }

    function processCallback(num, callback){
        return callback(num);
    }

    document.getElementById('demo').innerHTML = processCallback(6, square);
</script>
</html>
