<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retry API Call</title>
</head>
<body>
    <h1>Retry API Call</h1>
    <p id="demo"></p>
</body>
<script>
    async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                return data;
            } catch (error) {
                if (i < retries - 1) {
                    await new Promise(res => setTimeout(res, delay));
                } else {
                    document.getElementById('demo').innerHTML = 'API call failed after retries: ' + error;
                    throw error;
                }
            }
        }
        document.getElementById('demo').innerHTML = 'API call succeeded';
    }

    fetchWithRetry('https://jsonplaceholder.typicode.com/posts/1', {}, 3, 2000)
        .then(data => {
            document.getElementById('demo').innerHTML = JSON.stringify(data);
        });
</script>
</html>
