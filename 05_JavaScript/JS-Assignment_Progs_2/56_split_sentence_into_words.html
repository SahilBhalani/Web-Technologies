<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Sentences Into Words</title>
</head>
<body>
    <p id="demo"></p>
</body>
<script>
    function splitSentence(sentence){
        return sentence.split(" ");
    }
    document.getElementById('demo').innerHTML = splitSentence("Hello World! My Name is Sahil Bhalani").join(", ");
</script>
</html>
