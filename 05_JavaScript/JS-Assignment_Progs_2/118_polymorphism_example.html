<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymorphism Example</title>
</head>
<body>
    <h1>Polymorphism Example</h1>
    <p id="demo"></p>
</body>
<script>
    class Shape{
        area(){
            return 0;
        }
    }

    class Circle extends Shape{
        constructor(radius){
            super();
            this.radius = radius;
        }
        area(){
            return Math.PI * this.radius * this.radius
        }
    }

    class Rectangle extends Shape{
        constructor(width, height){
            super();
            this.width = width;
            this.height = height;
        }

        area(){
            return this.width * this.height
        }
    }

    const myCircle = new Circle(5);
    const myRectangle = new Rectangle(4, 6);

    document.getElementById('demo').innerHTML = 
        "Circle Area: " + myCircle.area().toFixed(2) + "<br>" +
        "Rectangle Area: " + myRectangle.area();
</script>
</html>
