<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delay Function Using Promise</title>
</head>
<body>
    <h1>Delay Fuction Using Promise</h1>
    <p id="demo"></p>
</body>
<script>
    function delay(ms){
        return new Promise((resolve) => {
            setTimeout(resolve, ms)
        })
    }

    delay(3000).then(() => {
        document.getElementById('demo').innerHTML = "Function is Delayed by 3 Seconds";
    } )
</script>
</html>
