<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of Array Elements</title>
</head>
<body>
    <h1>Sum of Array Elements</h1>
    <p id="demo"></p>
</body>
<script>
    function sumArrayElem(arr){
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
            sum += arr[i];            
        }
        return sum;
    }

    let arr = [1,2,3,4,5];
    document.getElementById('demo').innerHTML = "The Sum of Array Element is: " + sumArrayElem(arr);
</script>
</html>
