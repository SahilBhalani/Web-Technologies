<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse An Array</title>
</head>
<body>
    <h1>Reverse An Array</h1>
    <p id="demo"></p>
</body>
<script>
    function revArr(arr){
        if(arr === 0){
            return null;
        }
        return arr.map((element, idx, arr) => arr[arr.length - 1 - idx]);
    }

    document.getElementById('demo').innerHTML = "Reversed Array: " + revArr([1,2,3,4,5,6]);
        
</script>
</html>
