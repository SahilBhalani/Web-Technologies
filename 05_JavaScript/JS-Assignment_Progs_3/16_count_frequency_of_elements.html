<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Frequency Of Elements</title>
</head>
<body>
    <h1>Count Frequency Of Elements</h1>
    <p id="demo"></p>
</body>
<script>
    function countFreq(arr){
        let freq = {};
        for(let i = 0; i < arr.length; i++){
        if(freq[arr[i]]){
            freq[arr[i]] += 1;
        } else {
            freq[arr[i]] = 1;
        }
    }
    return freq;
    }

    document.getElementById('demo').innerHTML = "The Frequency Of Elements Is: " + JSON.stringify(countFreq([1,2,2,4,5,2,5,2,3,5,6,7,4,4]));
</script>
</html>
