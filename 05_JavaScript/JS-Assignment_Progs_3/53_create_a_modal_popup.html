<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Modal Popup</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <h1>Modal Popup</h1>
    <button onclick="openModal()">Open Modal</button>
</body>
<script>
    function openModal(){
        alert("This is a modal popup!");
    }
</script>
</html>
