<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Union of Arrays</title>
</head>
<body>
    <h1>Find Union Of Arrays</h1>
    <p id="demo"></p>
</body>
<script>
    let fidUnion = (arr1,arr2) => {
        return [...new Set([...arr1, ...arr2])];
    }

    let array1 = [1, 2, 3, 4, 5];
    let array2 = [4, 5, 6, 7, 8];
    document.getElementById('demo').innerHTML = "Union Elements: " + fidUnion(array1, array2);
</script>
</html>
