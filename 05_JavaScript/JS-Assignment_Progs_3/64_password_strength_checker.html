<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker</title>
  </head>
  <body>
    <h1>Password Strength Checker</h1>
    <input type="password" id="passwordInput" placeholder="Enter Password" />
    <button onclick="checkPasswordStrength()">Check Strength</button>
    <p id="strengthResult"></p>
  </body>
  <script>
    function checkPasswordStrength(){
        const password = document.getElementById('passwordInput').value;
        let strength = "Weak";

        if(password.length >= 8){
            const hasUpperCase = /[A-Z]/.test(password);
            const hasLowerCase = /[a-z]/.test(password);
            const hasNumbers = /[0-9]/.test(password);
            const hasSpecialChars = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const conditionsMet = [hasUpperCase, hasLowerCase, hasNumbers, hasSpecialChars].filter(Boolean).length;
            if(conditionsMet >= 3){
                strength = "Medium";
            }
            if(conditionsMet === 4){
                strength = "Strong";
            }
        }
        document.getElementById('strengthResult').innerHTML = "Password Strength: " + strength;
    }
  </script>
</html>
