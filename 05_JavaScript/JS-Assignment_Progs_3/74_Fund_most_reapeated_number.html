<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Most Repeated Number</title>
</head>
<body>
    <h1>FInd Most Repeated Number</h1>
    <p id="demo"></p>
</body>
<script>
    function mostRepeated(arr){
        const freq = {};
        let maxCount = 0;
        let mostRepeatedNum = null;
        for(let num of arr){
            freq[num] = (freq[num] || 0) + 1;
            if(freq[num] > maxCount){
                maxCount = freq[num];
                mostRepeatedNum = num;
            }
        }
        return mostRepeatedNum;
    }
    document.getElementById('demo').innerHTML = "The Most Repeated Number Is: " + mostRepeated([1,2,3,4,5,1,2,1,3,1,4,1,1,5,1]);
</script>
</html>
