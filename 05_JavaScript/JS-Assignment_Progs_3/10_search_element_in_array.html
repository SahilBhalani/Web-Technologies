<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Element in Array</title>
</head>
<body>
    <h1>Search Element in Array</h1>
    <p id="demo"></p>
</body>
<script>
    function searchElem(arr, target){
        for(let i = 0; i < arr.length; i++){
            if(arr[i] === target){
                return true;
            }
        }
        return false;
    }

    document.getElementById('demo').innerHTML = searchElem([1,2,3,4,5], 5);
</script>
</html>
