<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary App Using API</title>
</head>
<body>
    <h1>Dictionary App Using API</h1>
    <input type="text" id="wordInput" placeholder="Enter a word" />
    <button onclick="search()">Search</button>
    <div id="result"></div>
</body>
<script>
    async function search() {
        const word = document.getElementById('wordInput').value;
        const apiUrl = `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error('Word not found');
            }
            const data = await response.json();
            const meanings = data[0].meanings.map(meaning => {
                const definitions = meaning.definitions.map(def => `<li>${def.definition}</li>`).join('');
                return `<h3>${meaning.partOfSpeech}</h3><ul>${definitions}</ul>`;
            }).join('');

            document.getElementById('result').innerHTML = `
                <h2>Definitions for "${word}":</h2>
                ${meanings}
            `;
        } catch (error) {
            document.getElementById('result').innerHTML = `<p>${error.message}</p>`;
        }
    }
</script>
</html>
