<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Unique Elements In Array</title>
</head>
<body>
    <h1>Find Unique Elements In Array</h1>
    <p id="demo"></p>
</body>
<script>
    let findUniqueElements = (arr) => {
        return arr.filter((item, index) => arr.indexOf(item) === index);
    };

    let arr = [1, 2, 2, 3, 4, 4, 5, 6, 6, 7, 8, 8, 9];

    document.getElementById('demo').innerHTML = "Unique Elements: " + findUniqueElements(arr);
</script>
</html>
