<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freeze and Seal Object</title>
  </head>
  <body>
    <h1>Freeze and seal object</h1>
    <p id="demo"></p>
  </body>
  <script>
    const myObj = {
      name: "sahil",
      age: 21,
    };

    Object.freeze(myObj);
    Object.seal(myObj);

    myObj.age = 22;
    myObj.city = "Mumbai";
    document.getElementById("demo").innerHTML =
      "Object after freeze and seal: " + JSON.stringify(myObj);
  </script>
</html>
