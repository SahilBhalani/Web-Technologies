<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure Function Example</title>
</head>
<body>
    <h1>Closure Function</h1>
    <p id="demo"></p>
</body>
<script>
    function outerFunc(outervariable){
        return function innerFunc(innervariable){
            return "Outer Variable: " + outervariable + ", Inner Variable: " + innervariable;
        }
    }

    const newFunction = outerFunc("outside");
    document.getElementById('demo').innerHTML = newFunction("inside");
</script>
</html>
