<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change text using DOM</title>
</head>
<body>
    <h1>Change Text Using DOM</h1>
    <p id="demo">This is the original text.</p>
</body>
<script>
    document.getElementById('demo').innerHTML = "The text is Changed using DOM.";
</script>
</html>
