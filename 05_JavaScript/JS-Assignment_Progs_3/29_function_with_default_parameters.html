<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function with default Parameters</title>
</head>
<body>
    <h1>Function With Default Parameters</h1>
    <p id="demo"></p>
</body>
<script>
    function greet(name = "Sahil"){
        return "Hello, " + name + "!"
    }

    document.getElementById('demo').innerHTML = greet() + "<br>" + greet("Jay");
</script>
</html>
