<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Intersection of Arrays</title>
  </head>
  <body>
    <h1>Find Intersection Of Array</h1>
    <p id="demo"></p>
  </body>
  <script>
    let findIntersec = (arr1, arr2) => {
        return arr1.filter((item) => arr2.includes(item));
    };

    let array1 = [1, 2, 3, 4, 5];
    let array2 = [4, 5, 6, 7, 8];
    document.getElementById('demo').innerHTML =
      "Intersection Elements: " + findIntersec(array1, array2);
  </script>
</html>
