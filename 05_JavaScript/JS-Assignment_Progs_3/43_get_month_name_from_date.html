<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Month Name From Date</title>
</head>
<body>
    <h1>Get Month Name From Date</h1>
    <p id="demo"></p>
</body>
<script>
    function getMonthName(date){
        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];
        return monthNames[date.getMonth()];
    }
    const date = new Date('2023-08-02');
    document.getElementById('demo').innerHTML = "Date: " + date.toDateString() + "<br>" + "Month Name: " + getMonthName(date);
</script>
</html>
