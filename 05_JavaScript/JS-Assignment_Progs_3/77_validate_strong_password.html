<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Strong Password</title>
</head>
<body>
    <h1>Validate Strong Password</h1>
    <p id="demo"></p>
</body>
<script>
    function validateStrongPassword(password){
        const strongPasswordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        return strongPasswordPattern.test(password);
    }

    document.getElementById('demo').innerHTML = "Is the password strong? " + validateStrongPassword("Str0ng@Passw0rd");
</script>
</html>
