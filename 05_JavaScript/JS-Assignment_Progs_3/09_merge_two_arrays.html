<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Two Arrays</title>
</head>
<body>
    <h1>Merge Two Arrays</h1>
    <p id="demo"></p>
</body>
<script>
    function mergeArr(arr1, arr2){
        let merge = [...arr1, ...arr2];
        return merge;
    }

    document.getElementById('demo').innerHTML = mergeArr([1,2,3], [4,5,6]);
</script>
</html>
