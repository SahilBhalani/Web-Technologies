<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Phone Number</title>
</head>
<body>
    <h1>Validate Phone Number</h1>
    <p id="demo"></p>
</body>
<script>
    function validatePhoneNumber(number){
        const phonePattern = /^\+?[0-9]{1,4}?[-.\s]?(\(?\d{1,3}?\)?[-.\s]?)?[\d-.\s]{3,15}$/;
        return phonePattern.test(number);
    }

    document.getElementById('demo').innerHTML = "Is the phone number valid? " + validatePhoneNumber("+91-9876543210");
</script>
</html>
