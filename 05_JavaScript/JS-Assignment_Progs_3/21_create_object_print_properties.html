<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Object and Print Properties</title>
</head>
<body>
    <h1>Create Object and Print Properties</h1>
    <p id="demo"></p>
</body>
<script>
    let person = {
        name: "Sahil Bhalani",
        age: 22,
        city: "Surat"
    }

    document.getElementById('demo').innerHTML = "Name: " + person.name + " | Age: " + person.age + " | City: " + person.city;
</script>
</html>
