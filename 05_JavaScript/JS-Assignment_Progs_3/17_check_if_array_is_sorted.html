<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check if array is sorted or not</title>
  </head>
  <body>
    <h1>Check if array is sorted</h1>
    <p id="demo"></p>
  </body>
  <script>
    let isArraySorted = (arr) => {
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < arr[i - 1]) {
          return false;
        }
      }
      return true;
    };

    let arr = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    document.getElementById("demo").innerHTML =
      "Is arr sorted? " + isArraySorted(arr);
  </script>
</html>
