<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Color in Button Click</title>
</head>
<body>
    <h1>Change Color in Button Click</h1>
    <button onclick="colorButton()">Click Me to Change Color</button>
</body>
<script>
    function colorButton(){
        document.querySelector('button').style.backgroundColor = "lightblue";
    }
</script>
</html>
