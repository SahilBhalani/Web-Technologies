<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher Order Function</title>
</head>
<body>
    <h1>Highre Order Function</h1>
    <p id="demo"></p>
</body>
<script>
    function greet(name){
        return "Hello " + name + "!";
    }

    function higerOrder(func, value){
        return func(value)
    };

    document.getElementById('demo').innerHTML = higerOrder(greet, "Sahil");
</script>
</html>
