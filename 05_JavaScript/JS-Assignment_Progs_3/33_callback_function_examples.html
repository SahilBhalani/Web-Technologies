<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Function Example</title>
</head>
<body>
    <h1>Callback function</h1>
    <p id="demo"></p>
</body>
<script>
    function greet(name){
        return "Hello " + name + "!";
    }

    function callbackFunction(func, value){
        return func(value);
    }

    document.getElementById('demo').innerHTML = callbackFunction(greet, "Sahil");
</script>
</html>
