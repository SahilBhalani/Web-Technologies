<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Largest Number In Array</title>
  </head>
  <body>
    <h1>Find Largest Number In Array</h1>
    <p id="demo"></p>
  </body>
  <script>
    function findLargestNum(arr) {
      if (arr.length === 0) {
        return null;
      }
      let largest = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] > largest) {
          largest = arr[i];
        }
      }
      return largest;
    }

    document.getElementById("demo").innerHTML = "The Largest Number is: " + findLargestNum([2,6,1,9,6,4,0]);
  </script>
</html>
