<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>
    <style>
        label, input {
            margin: 5px;
        }
        button {
            margin: 10px;
        }
        #emiResult {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Loan EMI Calculator</h1>
    <label for="principal">Principal Amount:</label>
    <input type="number" id="principal" /><br/> 
    <label for="rate">Annual Interest Rate (%):</label>
    <input type="number" id="rate" step="0.01" /><br/>
    <label for="tenure">Years</label>
    <input type="number" id="tenure" /><br/>
    <button onclick="calculateEMI()">Calculate EMI</button>
    <p id="emiResult"></p>
</body>
<script>
    function calculateEMI(){
        const principal = parseFloat(document.getElementById('principal').value);
        const annualRate = parseFloat(document.getElementById('rate').value);
        const years = parseFloat(document.getElementById('tenure').value);

        const monthlyRate = annualRate / (12 * 100);
        const months = years * 12;

        const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);

        document.getElementById('emiResult').innerHTML = "Monthly EMI: " + emi.toFixed(2);
    }
</script>
</html>
