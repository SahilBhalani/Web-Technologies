<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Even Elements</title>
</head>
<body>
    <h1>Filter Even Elements</h1>
    <p id="demo"></p>
</body>
<script>
        let filterEven = (nums) => nums.filter((num) => num % 2 == 0);

        let nums = [1,2,3,4,5,6,7,8,9];

        document.getElementById('demo').innerHTML = "Even Numbers: " + filterEven(nums);
</script>
</html>
