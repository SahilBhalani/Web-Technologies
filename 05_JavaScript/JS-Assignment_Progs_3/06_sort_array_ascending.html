<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array In Ascending Order</title>
</head>
<body>
    <h1>Sort Array In Ascending Order</h1>
    <p id="demo"></p>
</body>
<script>
    function sortAsc(arr){
        return arr.sort();
    }

    document.getElementById('demo').innerHTML ="Sorted Array : " + sortAsc([9,3,1,0,-1,5,12,65,34]);
</script>
</html>
