<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Post Example</title>
</head>
<body>
    <h1>Fetch API Post Example</h1>
    <button id="fetchButton">Send POST Request</button>
    <pre id="responseOutput"></pre>
</body>
<script>
    function sendPostRequest(){
        fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: 'foo',
                body: 'bar',
                userId: 1
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('responseOutput').textContent = JSON.stringify(data, null, 2);
            alert("Response Data: " + JSON.stringify(data));
        });
    }
    document.getElementById('fetchButton').addEventListener('click', sendPostRequest);
</script>
</html>
