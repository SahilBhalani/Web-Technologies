<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtract Days To Date</title>
</head>
<body>
    <h1>Subtract Days to Date</h1>
    <p id="demo"></p>
</body>
<script>
    function subtractDays(days, date){
        let result = new Date(date);
        result.setDate(result.getDate() - days);
        return result;
    }

    const today = new Date();
    document.getElementById('demo').innerHTML = "Today is: " + today.getDate() + "<br>" + "10 days before: " + subtractDays(10, today).getDate(); 
</script>
</html>
