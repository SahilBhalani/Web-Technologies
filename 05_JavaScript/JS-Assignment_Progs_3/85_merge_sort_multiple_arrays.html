<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge and Sort Multiple Arrays</title>
</head>
<body>
    <h1>Merge and Sort Multiple Arrays</h1>
    <p id="demo"></p>
</body>
<script>
    function mergeAndSortArrays(...arrs){
        const mergedArrays = [].concat(...arrs);
        return mergedArrays.sort((a, b) => a - b)
    }

    document.getElementById('demo').innerHTML = "Merged and Sorted Array: " + mergeAndSortArrays([3, 1, 4], [2, 5, 0], [8, 7, 6]);
</script>
</html>
