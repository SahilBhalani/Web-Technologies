<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search API Based</title>
</head>
<body>
    <h1>Image Search API Based</h1>
    <input type="text" id="searchInput" placeholder="Enter search term" />
    <button onclick="searchImages()">Search Images</button>
    <div id="imageResults"></div>
</body>
<script>
    async function searchImages(){
        const query = document.getElementById('searchInput').value;
        const apiUrl = `https://api.unsplash.com/search/photos?query=${query}&client_id=WiUrvkeCma1mWDnJ1LKUsVr4R9ysbHk1nBdw4VCgSRs`;

        try{
            const response = await fetch(apiUrl);
            const data = await response.json();
            const images = data.results;
            let imageHtml = '';
            images.forEach(image => {
                imageHtml += `<img src="${image.urls.small}" alt="${image.alt_description}" style="margin:10px;" />`;
            })
            document.getElementById('imageResults').innerHTML = imageHtml;
        } catch (error){
            console.error("Error Fetching Images:", error);
        }
    }
</script>
</html>
