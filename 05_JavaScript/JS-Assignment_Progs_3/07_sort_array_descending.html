<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array In Descending Order</title>
</head>
<body>
    <h1>Sort Array In Descending Order</h1>
    <p id="demo"></p>
</body>
<script>
    function sortDes(arr){
        return arr.sort().reverse();
    }

    document.getElementById('demo').innerHTML = "Reverse Sorted Array: " + sortDes([5,2,1,0,-1,6,8,1,9,0,4]);
</script>
</html>
