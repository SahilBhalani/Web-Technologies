<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery - Add Elements</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>

    <ol>
      <li>List item 1</li>
      <li>List item 2</li>
      <li>List item 3</li>
    </ol>

    <button id="btn1">Append Text</button>
    <button id="btn2">Append List items</button>
    <hr />

    <p class="po">This is a paragraph.</p>
    <p class="po">This is another paragraph.</p>

    <ol class="oll">
      <li>List item 1</li>
      <li>List item 2</li>
      <li>List item 3</li>
    </ol>

    <button id="btn3">Prepend Text</button>
    <button id="btn4">Prepend List items</button>
    <hr />

    <img
      src="https://w3schools.com/images/w3jquery.gif"
      alt="jQuery"
      width="100"
      height="140"
    /><br /><br />

    <button id="btnBef">Insert before</button>
    <button id="btnAft">Insert after</button>
  </body>
  <script>
    //jQuery append() Method
    $(document).ready(function () {
      $("#btn1").click(function () {
        $("p").append("<b> Appended Text</b>.");
      });

      $("#btn2").click(function () {
        $("ol").append("<li>Appended item</li>");
      });
    });

    // jQuery prepend() Method
    $(document).ready(function () {
      $("#btn3").click(function () {
        $(".po").prepend("<b>Prepended Text!</b>");
      });

      $("#btn4").click(function () {
        $(".oll").prepend("<li>Prepended Item</li>");
      });
    });

    //jQuery after() and before() Methods
    $(document).ready(function () {
        $("#btnBef").click(function(){
            $("img").before("<b>Before</b>");
        });

        $("#btnAft").click(function () {
            $("img").after("<i>After</i>")
          })
    });
  </script>
</html>
