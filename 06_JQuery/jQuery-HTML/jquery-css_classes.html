<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jquery - Get and Set CSS Classes</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      .important {
        font-weight: bold;
        font-size: xx-large;
      }

      .blue {
        color: blue;
      }

      .red {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>

    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>

    <div>This is some important text!!</div>
    <br />
    <button id="btn1">Add Class To Elements</button>
    <button id="btn2">Remove Class From Elements</button>
    <button id="btn3">Toggle Class From Elements</button>
  </body>
  <script>
    //jQuery addClass() Method
    $(document).ready(function () {
        $("#btn1").click(function () {
            $("h1 , h2 , p").addClass("blue");
            $("div").addClass("important red");
        });
    });
    
    //jQuery removeClass() Method
    $(document).ready(function () {
        $("#btn2").click(function () {
            $("h1, h2, p").removeClass("blue");
            $("div").removeClass("important red");
        });
    });

    //jQuery removeClass() Method
    $(document).ready(function () {
        $("#btn3").click(function() {
            $("h1, h2, p").toggleClass("blue");
            $("div").toggleClass("important red");
        });
    });
    </script>
</html>
