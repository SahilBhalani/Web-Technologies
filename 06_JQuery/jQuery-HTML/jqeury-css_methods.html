<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jquery CSS Methods</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <h2>This is a heading</h2>

    <p style="background-color: #ff0000">This is a paragraph.</p>
    <p style="background-color: #00ff00">This is a paragraph.</p>
    <p style="background-color: #0000ff">This is a paragraph.</p>

    <button id="btn1">Return background-color of p</button>
    <button id="btn2">Set Property</button>
    <button id="btn3">Set Multiple Property</button>

  </body>
  <script>

    //Return a CSS Property
    //To return a value of specified CSS Property
    $(document).ready(function () {
        $("#btn1").click(function () {
            alert("Background Color = " + $("p").css("background-color"));
          });
    });

    //Set a CSS Property
    //To set a specified CSS Property
    $(document).ready(function () {
        $("#btn2").click(function () { 
            $("p").css("background-color", "yellow");
        });
    });

    //Set Multiple CSS Properties
    //To set multiple CSS properties
    $(document).ready(function () {
        $("#btn3").click(function () {
            $("p").css({"background-color" : "maroon" , "font-size" : "200%" , "color" : "white" , "font-family" : "helvetica", "font-weight" : "600"});
          });
    });
  </script>
</html>
