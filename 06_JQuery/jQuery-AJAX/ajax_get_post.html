<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery - AJAX get() and post() Methods</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <button id="mybtn1">
      Send an HTTP GET request to a page and get the result back
    </button>
    <button id="mybtn2">
      Send an HTTP POST request to a page and get the result back
    </button>
  </body>
  <script>
    //jQuery $.get() Method
    //The $.get() method requests data from the server with an HTTP GET request
    $(document).ready(function () {
      $("#mybtn1").click(function () {
        $.get("demo_test_get.asp", function (data, status) {
          alert("Data: " + data + "\nStatus: " + status);
        });
      });
    });

    //jQuery $.post() Method
    //The $.post() Method requests data from a server using an HTTP POST request.
    $(document).ready(function () {
      $("#mybtn2").click(function () {
        $.post(
          "demo_test_post.asp",
          {
            name: "Donald Duck",
            city: "Duckburg",
          },
          function (data, status) {
            alert("Data: " + data + "\nStatus: " + status);
          }
        );
      });
    });
  </script>
</html>
