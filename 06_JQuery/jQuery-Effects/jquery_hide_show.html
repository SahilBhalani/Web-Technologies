<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jquery Effect - Hide & Show</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>
  <body>
    <h1>JQuery Effects - Hide & Show</h1>
    <p id="p1">If you click on the "Hide" Button, I will disappear</p>
    <button id="hide">Hide</button>
    <button id="show">Show</button>
    <hr />

    <button id="myBtn">Hide</button>
    <p id="p2">This is a paragraph with little content.</p><hr>

    <button id="myBtn2">Toggle between hiding and showing the paragraphs</button>
    <p id="p3">This is a paragraph with little content.</p><hr>
  </body>
  <script>
    $(document).ready(function () {
      $("#hide").click(function () {
        $("#p1").hide();
      });

      $("#show").click(function () {
        $("#p1").show();
      });
    });

    /***
     * $(selector).hide(soeed,callback);
     * The optional speed parameter specific the speed of the hiding , showing and can take the following values: "slow", "fast", or milliseconds
     *
     * THe optional callback parameter is a function to be executed after the hide() and show() method completes.
     *
     */
    $(document).ready(function () {
        $("#myBtn").click(function () {
            $("#p2").hide(400);
          });
    });

    //jQuery toggle()
    //You can also toggle beetween hiding and showing an element with the toggle() method.
    $(document).ready(function () {
        $("#myBtn2").click(function () { 
            $("#p3").toggle("fast");
        });
    });
  </script>
</html>
